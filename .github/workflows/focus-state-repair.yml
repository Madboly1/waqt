name: Waqt exact signed focus state repair
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/focus-state-repair.yml
permissions:
  contents: write
jobs:
  signed-focus-state-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
    - name: Apply minimal read-only compatibility repair
      run: |
        python3 - <<'PY'
        import pathlib,base64,hashlib,zlib
        assert hashlib.sha256(pathlib.Path('app/src/main/java/com/example/glassproductivity/AlarmScheduler.kt').read_bytes()).hexdigest()=='079bb8e81a20072c5952696a6c731ee687ad5807a9691442a1fddef479ffd6b9'
        assert hashlib.sha256(pathlib.Path('app/src/main/java/com/example/glassproductivity/MainActivity.kt').read_bytes()).hexdigest()=='88be4b3adad42dd6c233375cdd50d08629777ca8eec5d79cc585f105112bccec'
        assert hashlib.sha256(pathlib.Path('app/src/main/java/com/example/glassproductivity/StartupRecovery.kt').read_bytes()).hexdigest()=='e03b3baeac9e4576f19f61b42f68a3aba7c5567668ecc58d3b5cafbdbae6d8b0'
        p=pathlib.Path('app/src/main/java/com/example/glassproductivity/AlarmScheduler.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(zlib.decompress(base64.b64decode('')))
        p=pathlib.Path('app/src/main/java/com/example/glassproductivity/MainActivity.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(zlib.decompress(base64.b64decode('')))
        p=pathlib.Path('app/src/main/java/com/example/glassproductivity/StartupRecovery.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(zlib.decompress(base64.b64decode('')))
        p=pathlib.Path('app/src/main/java/com/example/glassproductivity/SavedNumericPreferences.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(zlib.decompress(base64.b64decode('')))
        p=pathlib.Path('app/src/test/java/com/example/glassproductivity/SavedNumericPreferencesTest.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(zlib.decompress(base64.b64decode('')))
        PY
        git diff --stat
    - name: Test timer state preservation and all backup regression suites
      run: |-
        set -o pipefail
        gradle :app:testDebugUnitTest --tests 'com.example.glassproductivity.SavedNumericPreferencesTest' --tests 'com.example.glassproductivity.Backup*' --tests 'com.example.glassproductivity.WaqtCloudBackupTest' --no-daemon --stacktrace | tee /tmp/focus-repair-test-log.txt
    - name: Decode existing release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
    - name: Build signed focus repair candidate
      env:
        WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
        WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
        WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
        WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
      run: gradle :app:assembleRelease --no-daemon --stacktrace
    - name: Verify package version signing and exact bytes
      run: |
        mkdir -p repair-evidence
        APK=app/build/outputs/apk/release/app-release.apk
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee repair-evidence/certificate.txt
        grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689' repair-evidence/certificate.txt
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' | tee repair-evidence/package.txt
        grep -q "name='com.example.glassproductivity' versionCode='105' versionName='5.6.79'" repair-evidence/package.txt
        sha256sum "$APK" | tee repair-evidence/apk-sha256.txt
    - uses: actions/download-artifact@v4
      with:
        name: waqt-signed-release-no-ota
        run-id: 44989788115
        github-token: ${{ github.token }}
        path: original-apk
    - uses: actions/download-artifact@v4
      with:
        name: waqt-recovery-diagnostic-not-approved-for-install
        run-id: 45005635166
        github-token: ${{ github.token }}
        path: diagnostic-apk
    - name: Verify both existing artifact bytes
      run: |-
        echo '17ecc7747d5c15cf27a2f8f703be81be752905249912e027f6b0f1268f3235e3  original-apk/app-release.apk' | sha256sum -c -
        echo '4ad40e53a2f93314ee01bab677ecf39ac37cc7a181af3e92858bacab0f44e40a  diagnostic-apk/app-release.apk' | sha256sum -c -
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot test device
      env:
        API: '36'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_SDK_HOME="$HOME"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
        CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
        test -f "$CFG"
        echo 'hw.ramSize=3072' >> "$CFG"
        echo 'disk.dataPartition.size=4G' >> "$CFG"
        nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Verify real failure path then exact signed repair upgrade and relaunch
      run: |
        set -e
        mkdir -p repair-evidence
        PKG=com.example.glassproductivity
        DATA=/data/user/0/$PKG
        adb shell input keyevent 82
        adb install original-apk/app-release.apk | tee repair-evidence/original-install.txt
        adb root
        adb wait-for-device
        OWNER=$(adb shell stat -c %u "$DATA" | tr -d '\r')
        # First let the original initialize normal defaults on disposable state.
        adb shell am start -W -n "$PKG/.MainActivity" > repair-evidence/original-clean-launch.txt
        sleep 7
        adb shell am force-stop "$PKG"
        adb exec-out cat "$DATA/shared_prefs/waqt_prefs.xml" > /tmp/repair-settings.xml
        adb exec-out cat "$DATA/shared_prefs/waqt_productivity_prefs.xml" > /tmp/repair-productivity.xml
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as E,json,datetime
        for filename,changes in {
        '/tmp/repair-settings.xml':[
         ('boolean','onboarding_done','true'),('boolean','ota_auto_check','false'),
         ('boolean','pref_dark_mode','false'),('int','rail_offset','1'),('int','rail_edge','1')],
        '/tmp/repair-productivity.xml':[
         ('string','waqt_items_json',json.dumps([{'id':'keep-task','title':'KEEP UPGRADE TASK','hour':9,'minute':30,'isHabit':False,'hasReminder':False}])),
         ('string','waqt_notes_json',json.dumps([{'id':'keep-note','title':'KEEP UPGRADE NOTE'}])),
         ('int','active_focus_start_ms','0'),('int','active_focus_total_ms','1500000'),
         ('int','active_focus_remaining_pause_ms','42000'),('boolean','active_focus_running','false'),
         ('int','waqt_focus_epoch_day',str(datetime.datetime.now().year*366+datetime.datetime.now().timetuple().tm_yday)),
         ('int','waqt_today_focus_minutes','37')]
        }.items():
         r=E.parse(filename).getroot()
         for tag,key,value in changes:
          for n in list(r):
           if n.get('name')==key:r.remove(n)
          n=E.SubElement(r,tag,name=key)
          if tag=='string':n.text=value
          else:n.set('value',value)
         Path(filename).write_bytes(E.tostring(r,encoding='utf-8',xml_declaration=True))
        PY
        adb push /tmp/repair-settings.xml "$DATA/shared_prefs/waqt_prefs.xml"
        adb push /tmp/repair-productivity.xml "$DATA/shared_prefs/waqt_productivity_prefs.xml"
        adb shell mkdir -p "$DATA/files/journal_audio"
        adb shell "echo REPAIR_MEDIA_KEEP > $DATA/files/journal_audio/keep-sentinel.wav"
        adb shell chown -R "$OWNER:$OWNER" "$DATA/shared_prefs" "$DATA/files"
        adb shell restorecon -R "$DATA/shared_prefs" "$DATA/files"
        adb logcat -c
        adb shell am start -W -n "$PKG/.MainActivity" > repair-evidence/original-populated-launch.txt || true
        sleep 4
        adb logcat -d > repair-evidence/original-logcat.txt
        grep -q 'ReminderRepository.getActiveFocusState' repair-evidence/original-logcat.txt
        grep -q 'Integer cannot be cast to java.lang.Long' repair-evidence/original-logcat.txt
        adb shell am force-stop "$PKG"
        adb install -r diagnostic-apk/app-release.apk | tee repair-evidence/diagnostic-update.txt
        adb shell am start -W -n "$PKG/.MainActivity" > repair-evidence/diagnostic-launch.txt
        sleep 4
        adb exec-out screencap -p > repair-evidence/before-diagnostic.png
        adb shell uiautomator dump /sdcard/repair.xml
        adb pull /sdcard/repair.xml repair-evidence/before-diagnostic.xml
        grep -q 'WAQT_STARTUP_RECOVERY_TRACE' repair-evidence/before-diagnostic.xml
        adb shell am force-stop "$PKG"
        adb exec-out cat "$DATA/shared_prefs/waqt_prefs.xml" > repair-evidence/settings-before.xml
        adb exec-out cat "$DATA/shared_prefs/waqt_productivity_prefs.xml" > repair-evidence/productivity-before.xml
        adb shell "find $DATA/shared_prefs $DATA/files -type f -exec sha256sum {} \; | sort" > repair-evidence/before-hashes.txt
        adb install -r app/build/outputs/apk/release/app-release.apk | tee repair-evidence/repair-update.txt
        for pass in first repeat; do
         adb logcat -c
         adb shell am start -W -n "$PKG/.MainActivity" > "repair-evidence/$pass-launch.txt"
         sleep 7
         adb shell pidof "$PKG" > "repair-evidence/$pass-pid.txt"
         adb logcat -d > "repair-evidence/$pass-logcat.txt"
         if grep -q 'Process: com.example.glassproductivity' "repair-evidence/$pass-logcat.txt"; then exit 1; fi
         adb exec-out screencap -p > "repair-evidence/$pass-normal.png"
         adb shell uiautomator dump /sdcard/repair.xml
         adb pull /sdcard/repair.xml "repair-evidence/$pass-normal.xml"
         if grep -q 'WAQT_STARTUP_RECOVERY_TRACE' "repair-evidence/$pass-normal.xml"; then exit 1; fi
         grep -q 'KEEP UPGRADE TASK' "repair-evidence/$pass-normal.xml"
         adb shell am force-stop "$PKG"
        done
        adb exec-out cat "$DATA/shared_prefs/waqt_prefs.xml" > repair-evidence/settings-after.xml
        adb exec-out cat "$DATA/shared_prefs/waqt_productivity_prefs.xml" > repair-evidence/productivity-after.xml
        adb shell "find $DATA/shared_prefs $DATA/files -type f -exec sha256sum {} \; | sort" > repair-evidence/after-hashes.txt
        python3 - <<'PYCOMPARE'
        from pathlib import Path
        import xml.etree.ElementTree as E
        p=Path('repair-evidence')
        # Compare every existing preference semantically including its XML type and crash trace.
        def entries(path):
         r=E.parse(path).getroot()
         return {n.get('name'):(n.tag,n.get('value'),n.text,E.tostring(n,encoding='unicode') if n.tag=='set' else None) for n in r}
        for name in ['settings','productivity']:
         before=entries(p/(name+'-before.xml'));after=entries(p/(name+'-after.xml'))
         assert before==after,(name,before,after)
         assert (p/(name+'-before.xml')).read_bytes()==(p/(name+'-after.xml')).read_bytes(),name
        for phase in ['before','after']:
         lines=(p/(phase+'-hashes.txt')).read_text().splitlines()
         (p/(phase+'-business-hashes.txt')).write_text('\n'.join(x for x in lines if not x.endswith('/files/profileInstalled'))+'\n')
        assert (p/'before-business-hashes.txt').read_bytes()==(p/'after-business-hashes.txt').read_bytes()
        assert entries(p/'productivity-after.xml')['active_focus_start_ms'][:2]==('int','0')
        assert entries(p/'productivity-after.xml')['active_focus_total_ms'][:2]==('int','1500000')
        assert entries(p/'productivity-after.xml')['active_focus_remaining_pause_ms'][:2]==('int','42000')
        assert 'last_crash' in entries(p/'settings-after.xml')
        print('READ_ONLY_COMPATIBILITY_NO_STATE_REWRITE=yes')
        PYCOMPARE
        # Unknown recorded failures must still enter diagnostics, rather than auto-retry.
        python3 - <<'PYUNKNOWN'
        import xml.etree.ElementTree as E
        from pathlib import Path
        r=E.parse('repair-evidence/settings-after.xml').getroot()
        for n in r:
         if n.get('name')=='last_crash':n.text='WAQT_UNKNOWN_SYNTHETIC_STARTUP_FAILURE'
        Path('/tmp/repair-unknown.xml').write_bytes(E.tostring(r,encoding='utf-8',xml_declaration=True))
        PYUNKNOWN
        adb push /tmp/repair-unknown.xml "$DATA/shared_prefs/waqt_prefs.xml"
        adb shell chown "$OWNER:$OWNER" "$DATA/shared_prefs/waqt_prefs.xml"
        adb shell restorecon "$DATA/shared_prefs/waqt_prefs.xml"
        adb shell am start -W -n "$PKG/.MainActivity" > repair-evidence/unknown-launch.txt
        sleep 4
        adb exec-out screencap -p > repair-evidence/unknown-recovery.png
        adb shell uiautomator dump /sdcard/repair.xml
        adb pull /sdcard/repair.xml repair-evidence/unknown-recovery.xml
        grep -q 'WAQT_STARTUP_RECOVERY_TRACE' repair-evidence/unknown-recovery.xml
        grep -q 'WAQT_UNKNOWN_SYNTHETIC_STARTUP_FAILURE' repair-evidence/unknown-recovery.xml
        printf '%s\n' ORIGINAL_REAL_PATH_REPRODUCED=yes DIAGNOSTIC_UPGRADE_CHAIN=yes SIGNED_REPAIR_NORMAL_START=yes SIGNED_REPAIR_RELAUNCH=yes ALL_PREFS_AND_BUSINESS_FILES_UNCHANGED=yes ORIGINAL_NUMERIC_VALUES_AND_TYPES_UNCHANGED=yes STORED_TRACE_RETAINED=yes UNKNOWN_CRASH_STILL_DIAGNOSTIC=yes > repair-evidence/verdict.txt
        cat repair-evidence/verdict.txt
    - name: Keep exact signed candidate for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-focus-type-repair-review-only
        path: app/build/outputs/apk/release/app-release.apk
    - name: Keep repair evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-focus-type-repair-evidence
        path: repair-evidence/
    - name: Publish disposable repair evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/focus-repair-publish
        cp repair-evidence/* /tmp/focus-repair-publish/ 2>/dev/null || true
        cp app/build/test-results/testDebugUnitTest/*.xml /tmp/focus-repair-publish/ 2>/dev/null || true
        cp /tmp/focus-repair-test-log.txt /tmp/focus-repair-publish/test-log.txt 2>/dev/null || true
        cd /tmp/focus-repair-publish
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable exact signed focus numeric recovery evidence' || true
        git branch -M "focus-repair-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force
    - name: Persist exact tested repair only after all gates pass
      run: |
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add app/src/main/java/com/example/glassproductivity/AlarmScheduler.kt app/src/main/java/com/example/glassproductivity/MainActivity.kt app/src/main/java/com/example/glassproductivity/StartupRecovery.kt app/src/main/java/com/example/glassproductivity/SavedNumericPreferences.kt app/src/test/java/com/example/glassproductivity/SavedNumericPreferencesTest.kt
        git commit -m 'Read legacy focus timer numbers without rewriting saved state'
        git push origin HEAD:feature/google-drive-backup
