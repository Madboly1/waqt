name: WAQT Tour Visual Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/waqt-guided-icon-tour
    paths:
      - .github/workflows/tour-visual-check.yml

permissions:
  contents: write

jobs:
  tour-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Install emulator image
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/cmdline-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Create and boot AVD
        run: |
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n tour -k "system-images;android-31;google_apis;x86_64" --device "pixel_5" --force
          avdmanager list avd || true
          CFG="$ANDROID_AVD_HOME/tour.avd/config.ini"
          if [ ! -f "$CFG" ]; then
            echo "config.ini not at $CFG, searching..."
            CFG=$(find "$HOME" /usr/local/lib/android -maxdepth 6 -path "*tour.avd/config.ini" 2>/dev/null | head -1)
          fi
          if [ -z "$CFG" ] || [ ! -f "$CFG" ]; then
            echo "tour AVD config.ini not found anywhere"
            ls -la "$HOME/.android" || true
            exit 1
          fi
          export ANDROID_AVD_HOME="$(dirname "$(dirname "$CFG")")"
          echo "hw.ramSize=3072" >> "$CFG"
          echo "disk.dataPartition.size=4G" >> "$CFG"
          nohup emulator -avd tour -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "booted after $((i*5))s"; break; fi
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "EMULATOR BOOT TIMEOUT after 600s"
            tail -50 /tmp/emulator.log || true
            exit 1
          fi
      - name: Run tour and capture screenshots
        run: |
          set -x
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm clear com.example.glassproductivity
          adb shell am start -n com.example.glassproductivity/.MainActivity
          sleep 12
          mkdir -p shots
          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1
            python3 - "$1" <<'PY' > /tmp/tap.txt
          import re, sys
          target = sys.argv[1]
          xml = open('ui.xml', encoding='utf-8').read()
          for m in re.finditer(r'text="([^"]*)"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml):
              if target in m.group(1):
                  x = (int(m.group(2)) + int(m.group(4))) // 2
                  y = (int(m.group(3)) + int(m.group(5))) // 2
                  print(x, y)
                  break
          PY
          }
          for i in 1 2 3 4 5 6 7; do
            adb exec-out screencap -p > shots/step_$i.png
            tap_text "التالي"
            read X Y < /tmp/tap.txt || true
            if [ -z "${X:-}" ]; then
              tap_text "إنهاء"
              read X Y < /tmp/tap.txt || true
            fi
            if [ -n "${X:-}" ]; then adb shell input tap $X $Y; fi
            unset X Y
            sleep 3
          done
          adb exec-out screencap -p > shots/final.png
          adb shell input keyevent 4
          sleep 1
          adb exec-out screencap -p > shots/back_once.png
          PID1=$(adb shell pidof com.example.glassproductivity || true)
          echo "PID after single back: ${PID1:-gone}"
          adb shell input keyevent 4
          sleep 1
          PID2=$(adb shell pidof com.example.glassproductivity || true)
          echo "PID after double back: ${PID2:-gone}"
          adb exec-out screencap -p > shots/back_twice.png
          echo "SINGLE_BACK_PID=${PID1:-gone}" > shots/back_result.txt
          echo "DOUBLE_BACK_PID=${PID2:-gone}" >> shots/back_result.txt
      - name: Upload tour screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-shots
          path: shots/

      - name: Push shots to evidence branch
        if: always()
        run: |
          set -e
          BR="tour-evidence-r${{ github.run_id }}"
          mkdir -p /tmp/ev
          cp shots/*.png shots/*.txt /tmp/ev/ 2>/dev/null || true
          cd /tmp/ev
          for f in *.png; do
            [ -f "$f" ] || continue
            md5sum "$f"
            python3 - "$f" <<'PYEOF'
          import struct, sys
          d = open(sys.argv[1], 'rb').read()
          w, h = struct.unpack('>II', d[16:24])
          print(f"{sys.argv[1]}: {w}x{h}, {len(d)} bytes")
          PYEOF
          done
          git init -b "$BR" .
          git config user.email "ci@waqt.local"
          git config user.name "waqt-tour-ci"
          git add .
          git commit -m "Tour visual evidence for run ${{ github.run_id }} (head ${{ github.sha }})"
          PUSH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push "$PUSH_URL" "$BR:$BR"
      - name: Emulator log on failure
        if: failure()
        run: tail -100 /tmp/emulator.log || true
