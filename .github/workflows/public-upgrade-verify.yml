name: Waqt 5.6.80 public upgrade safety gate
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/public-upgrade-verify.yml
permissions:
  contents: read
  actions: read
jobs:
  public-upgrade-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45033086383
        name: waqt-5.6.80-public-release-verified-candidate
        path: verified-build
    - name: Validate and reuse exact already-tested signed build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/Madboly1/waqt/actions/runs/45033086383 > /tmp/build-run.json
        gh api repos/Madboly1/waqt/actions/runs/45033086383/jobs > /tmp/build-jobs.json
        python3 - <<'PY'
        import json,pathlib,hashlib,shutil
        r=json.load(open('/tmp/build-run.json'))
        assert r['status']=='completed' and r['head_sha']=='f029f260286c3029d9057df92f2c46791d727a69',r
        j=json.load(open('/tmp/build-jobs.json'))['jobs'][0]
        for name in ['Check accepted application lineage and version-only app change','Run complete regressions and build signed 5.6.80','Validate original public APK and new package certificate versions']:
         assert next(s for s in j['steps'] if s['name']==name)['conclusion']=='success',name
        src=pathlib.Path('verified-build/app/build/outputs/apk/release/app-release.apk')
        assert hashlib.sha256(src.read_bytes()).hexdigest()=='e3a45daf0f8a4953874d568b763b24af553d8d60f9c29291a33b48b451b6d26c'
        dst=pathlib.Path('app/build/outputs/apk/release/app-release.apk');dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
        pathlib.Path('release-proof').mkdir(exist_ok=True)
        shutil.copy2('verified-build/release-proof/unit-verdict.json','release-proof/unit-verdict.json')
        shutil.copytree('verified-build/app/build/test-results/testDebugUnitTest','app/build/test-results/testDebugUnitTest',dirs_exist_ok=True)
        units=json.load(open('release-proof/unit-verdict.json'))
        assert sum(int(r['tests']) for r in units)>=66 and all(int(r['failures'])==int(r['errors'])==int(r['skipped'])==0 for r in units),units
        pathlib.Path('release-proof/build-artifact-provenance.json').write_text(json.dumps({'run_id':45033086383,'source_commit':r['head_sha'],'apk_sha256':hashlib.sha256(src.read_bytes()).hexdigest()},indent=2))
        print('REUSING_EXACT_66_TEST_PASSED_SIGNED_APK_WITHOUT_REBUILD=yes')
        PY
        git fetch --depth=1 origin f029f260286c3029d9057df92f2c46791d727a69
        git diff --exit-code f029f260286c3029d9057df92f2c46791d727a69 -- app
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45015447376
        name: waqt-settings-updater-candidate-not-yet-install-approved
        path: accepted-private105
    - name: Validate original public APK and new package certificate versions
      run: |
        set -euo pipefail
        curl -fL --retry 2 https://github.com/Madboly1/waqt/releases/download/v5.6.79/app-release.apk -o public105.apk
        echo '9e13b583646c650dbc2493f99943c2fd05af4ee0600bb04532e9e253eaca0cc8  public105.apk' | sha256sum -c -
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        for APK in public105.apk app/build/outputs/apk/release/app-release.apk; do
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee -a release-proof/certificates.txt
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689'
        done
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' | tee release-proof/package.txt
        grep -q "name='com.example.glassproductivity' versionCode='106' versionName='5.6.80'" release-proof/package.txt
        sha256sum app/build/outputs/apk/release/app-release.apk | tee release-proof/apk-sha256.txt
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot disposable API31 test device
      run: |
        set -euo pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/sdk-licenses.log || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-31;google_apis;x86_64'
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n publicupgrade -k 'system-images;android-31;google_apis;x86_64' --device pixel_5 --force
        echo 'hw.ramSize=3072' >> "$ANDROID_AVD_HOME/publicupgrade.avd/config.ini"
        echo 'disk.dataPartition.size=4G' >> "$ANDROID_AVD_HOME/publicupgrade.avd/config.ini"
        nohup "$ANDROID_HOME/emulator/emulator" -avd publicupgrade -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Verify real public105 and accepted105 populated upgrades to exact106
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64,pathlib
        pathlib.Path('/tmp/waqt_public_upgrade.py').write_bytes(base64.b64decode(''))
        PY
        python3 /tmp/waqt_public_upgrade.py
      env:
        WAQT_TESTED_SOURCE_SHA: f029f260286c3029d9057df92f2c46791d727a69
    - name: Capture failure diagnostics
      if: always()
      run: |
        adb logcat -d > release-proof/final-logcat.txt || true
        adb exec-out screencap -p > release-proof/final-screen.png || true
        cp /tmp/emulator.log release-proof/emulator.log || true
    - name: Keep exact signed candidate and synthetic evidence private
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-5.6.80-public-release-verified-candidate
        path: 'app/build/outputs/apk/release/app-release.apk

          release-proof/

          app/build/test-results/testDebugUnitTest/

          '
        retention-days: 14
