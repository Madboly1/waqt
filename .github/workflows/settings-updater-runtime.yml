name: Waqt exact settings and installer runtime proof
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/settings-updater-runtime.yml
permissions:
  contents: write
  actions: read
jobs:
  settings-exact-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
    - name: Await exact private candidate build gate using anonymous public status
      run: |
        set -euo pipefail
        for attempt in $(seq 1 8); do
         curl -fsSL 'https://api.github.com/repos/Madboly1/waqt/actions/runs/45013047844' -o /tmp/exact-build.json
         STATUS=$(python3 -c 'import json;print(json.load(open("/tmp/exact-build.json"))["status"])')
         if [ "$STATUS" = completed ]; then
          python3 -c 'import json;x=json.load(open("/tmp/exact-build.json"));assert x["conclusion"]=="success",x["conclusion"]'
          exit 0
         fi
         sleep 60
        done
        exit 1
    - uses: actions/checkout@v4
      with:
        ref: e46dedf819910b804d8c8fa6f3fed38c937ee2a8
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45013047844
        name: waqt-settings-updater-candidate-not-yet-install-approved
        path: exact-candidate
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45009661515
        name: waqt-focus-type-repair-exact-retested
        path: base-apk
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
    - name: Apply approved settings and updater candidate without publishing
      run: |
        python3 - <<'PYSOURCE'
        import base64,pathlib,subprocess,json
        patch=''
        pathlib.Path('/tmp/settings.patch').write_bytes(base64.b64decode(patch))
        subprocess.run(['git','apply','/tmp/settings.patch'],check=True)
        files={'app/src/main/java/com/example/glassproductivity/WaqtUpdateManifest.kt': '', 'app/src/main/java/com/example/glassproductivity/WaqtUpdateClient.kt': '', 'app/src/test/java/com/example/glassproductivity/WaqtUpdateSafetyTest.kt': ''}
        for name,data in files.items():
         p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
        PYSOURCE
    - name: Decode existing release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
    - name: Prepare isolated lower-version fixture and instrumentation with exact candidate bytes
      run: |
        python3 - <<'PYPREP'
        from pathlib import Path
        import base64
        files={'WaqtUpdaterProbe.kt': '', 'test_settings_runtime.sh': '', 'runtime_ui_probe.py': ''}
        for name,data in files.items():Path(name).write_bytes(base64.b64decode(data))
        # Source-for-source match with the already-built exact candidate.
        pairs={
        'MainActivity.kt':'app/src/main/java/com/example/glassproductivity/MainActivity.kt',
        'WaqtUpdateManifest.kt':'app/src/main/java/com/example/glassproductivity/WaqtUpdateManifest.kt',
        'WaqtUpdateClient.kt':'app/src/main/java/com/example/glassproductivity/WaqtUpdateClient.kt',
        'WaqtUpdateSafetyTest.kt':'app/src/test/java/com/example/glassproductivity/WaqtUpdateSafetyTest.kt',
        'WaqtCloudBackup.kt':'app/src/main/java/com/example/glassproductivity/WaqtCloudBackup.kt',
        'BackupPreferenceTypes.kt':'app/src/main/java/com/example/glassproductivity/BackupPreferenceTypes.kt',
        'StartupRecovery.kt':'app/src/main/java/com/example/glassproductivity/StartupRecovery.kt',
        'SavedNumericPreferences.kt':'app/src/main/java/com/example/glassproductivity/SavedNumericPreferences.kt',
        'AlarmScheduler.kt':'app/src/main/java/com/example/glassproductivity/AlarmScheduler.kt',
        'AndroidManifest.xml':'app/src/main/AndroidManifest.xml',
        'file_paths.xml':'app/src/main/res/xml/file_paths.xml'}
        for name,path in pairs.items():
         assert Path(path).read_bytes()==Path('exact-candidate/settings-source',name).read_bytes(),path
        p=Path('app/build.gradle.kts');s=p.read_text();Path('/tmp/original-build.gradle.kts').write_text(s)
        s=s.replace('versionCode = 105','versionCode = 104').replace('versionName = "5.6.79"','versionName = "5.6.78-fixture"')
        s=s.replace('versionName = "5.6.78-fixture"','versionName = "5.6.78-fixture"\n        testApplicationId = "com.example.glassproductivity.runtimeprobe"\n        testInstrumentationRunner = "com.example.glassproductivity.WaqtUpdaterProbe"')
        s=s.replace('    compileOptions {','    testBuildType = "release"\n\n    compileOptions {')
        p.write_text(s)
        t=Path('app/src/androidTest/java/com/example/glassproductivity/WaqtUpdaterProbe.kt');t.parent.mkdir(parents=True,exist_ok=True);t.write_bytes(Path('WaqtUpdaterProbe.kt').read_bytes())
        a=Path('app/src/androidTest/assets/exact-candidate.apk');a.parent.mkdir(parents=True,exist_ok=True);a.write_bytes(Path('exact-candidate/app/build/outputs/apk/release/app-release.apk').read_bytes())
        PYPREP
        mkdir -p settings-runtime-evidence
        sha256sum exact-candidate/app/build/outputs/apk/release/app-release.apk | tee settings-runtime-evidence/exact-candidate-sha256.txt
    - name: Compile same-certificate emulator-only fixture and probe
      env:
        WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
        WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
        WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
        WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        gradle :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon --stacktrace 2>&1 | tee settings-runtime-evidence/fixture-build.log
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        FIXTURE_APK="$PWD/app/build/outputs/apk/release/app-release.apk"
        TEST_APK=$(find "$PWD/app/build/outputs/apk/androidTest" -name '*.apk' | head -1)
        CANDIDATE_APK="$PWD/exact-candidate/app/build/outputs/apk/release/app-release.apk"
        BASE_APK=$(find "$PWD/base-apk" -name '*.apk' | head -1)
        test -n "$TEST_APK"
        for APK in "$FIXTURE_APK" "$TEST_APK" "$CANDIDATE_APK" "$BASE_APK"; do
         "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee -a settings-runtime-evidence/all-apk-certificates.txt
         "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689'
        done
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$FIXTURE_APK" > settings-runtime-evidence/fixture-package.txt
        head -1 settings-runtime-evidence/fixture-package.txt
        grep -q "versionCode='104' versionName='5.6.78-fixture'" settings-runtime-evidence/fixture-package.txt
        for key in FIXTURE_APK TEST_APK CANDIDATE_APK BASE_APK; do echo "$key=${!key}" >> "$GITHUB_ENV"; done
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot test device
      env:
        API: '36'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/sdk-licenses.log || true
        if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_SDK_HOME="$HOME"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
        CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
        test -f "$CFG"
        echo 'hw.ramSize=3072' >> "$CFG"
        echo 'disk.dataPartition.size=4G' >> "$CFG"
        nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Verify exact signed settings in place then real updater to Android installer
      run: |
        set -euo pipefail
        adb shell wm size 1080x2400
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
        bash test_settings_runtime.sh
    - name: Preserve synthetic runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-settings-runtime-evidence
        path: |
          settings-runtime-evidence/
          /tmp/emulator.log
    - name: Publish synthetic screenshots and verdict for inspection
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/settings-runtime-report
        if [ -d settings-runtime-evidence ]; then cp -R settings-runtime-evidence/. /tmp/settings-runtime-report/; fi
        cp /tmp/emulator.log /tmp/settings-runtime-report/emulator.log || true
        # The evidence branch contains synthetic data and logs, not APKs or private sources.
        find /tmp/settings-runtime-report -name '*.apk' -delete
        cd /tmp/settings-runtime-report
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable exact signed settings and installer runtime evidence' || true
        git branch -M "settings-runtime-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD
