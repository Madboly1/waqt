name: Waqt exact settings and installer runtime proof
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/settings-updater-runtime.yml
permissions:
  contents: write
  actions: read
jobs:
  settings-exact-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Await final bidi-only candidate build
      run: |
        set -euo pipefail
        for attempt in $(seq 1 8); do
         curl -fsSL 'https://api.github.com/repos/Madboly1/waqt/actions/runs/45015447376' -o /tmp/current-build.json
         STATUS=$(python3 -c 'import json;print(json.load(open("/tmp/current-build.json"))["status"])')
         if [ "$STATUS" = completed ]; then
          python3 -c 'import json;x=json.load(open("/tmp/current-build.json"));assert x["conclusion"]=="success",x["conclusion"]'
          exit 0
         fi
         sleep 60
        done
        exit 1
    - uses: actions/checkout@v4
      with:
        ref: e46dedf819910b804d8c8fa6f3fed38c937ee2a8
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45015447376
        name: waqt-settings-updater-candidate-not-yet-install-approved
        path: exact-candidate
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45014289422
        name: waqt-settings-updater-candidate-not-yet-install-approved
        path: fixture-source-proof
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45014376643
        name: waqt-disposable-signed-runtime-fixture
        path: fixture-assets
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45009661515
        name: waqt-focus-type-repair-exact-retested
        path: base-apk
    - name: Decode existing release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
    - name: Verify unchanged updater source and rebind probe to exact final APK
      env:
        WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
        WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
        WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
        WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        curl -fsSL 'https://api.github.com/repos/Madboly1/waqt/actions/runs/45014376643/jobs' -o /tmp/fixture-provenance.json
        mkdir -p settings-runtime-evidence
        python3 - <<'PYFILES'
        from pathlib import Path
        import base64,json,hashlib,zipfile
        x=json.load(open('/tmp/fixture-provenance.json'))['jobs'][0]
        needed=['Prepare isolated lower-version fixture and instrumentation with exact candidate bytes','Compile same-certificate emulator-only fixture and probe','Preserve identical disposable fixture and probe for bounded UI retries']
        for name in needed:assert next(s for s in x['steps'] if s['name']==name)['conclusion']=='success',name
        files={'test_settings_runtime.sh': '', 'runtime_ui_probe.py': ''}
        for name,data in files.items():Path(name).write_bytes(base64.b64decode(data))
        old=Path('fixture-source-proof/settings-source');new=Path('exact-candidate/settings-source')
        for name in ['WaqtUpdateClient.kt','WaqtUpdateManifest.kt','WaqtUpdateSafetyTest.kt','WaqtCloudBackup.kt','BackupPreferenceTypes.kt','StartupRecovery.kt','SavedNumericPreferences.kt','AlarmScheduler.kt','AndroidManifest.xml','file_paths.xml']:
         assert (old/name).read_bytes()==(new/name).read_bytes(),name
        oldmain=(old/'MainActivity.kt').read_text();newmain=(new/'MainActivity.kt').read_text()
        assert newmain.count(chr(92)+'u2066')==1 and newmain.count(chr(92)+'u2069')==1
        assert oldmain==newmain.replace(chr(92)+'u2066','').replace(chr(92)+'u2069','')
        assert 'https://t.me/cadr_tech' in newmain
        apk=Path('exact-candidate/app/build/outputs/apk/release/app-release.apk')
        expected=Path('exact-candidate/settings-evidence/apk-sha256.txt').read_text().split()[0]
        assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
        rows=json.loads(Path('exact-candidate/settings-evidence/unit-verdict.json').read_text())
        assert sum(int(r['tests']) for r in rows)==66
        assert all(int(r['failures'])+int(r['errors'])+int(r['skipped'])==0 for r in rows)
        Path('settings-runtime-evidence/exact-candidate-sha256.txt').write_text(expected+'\n')
        # Rebind only the CI probe asset, never change the delivered APK or fixture code.
        probes=[p for p in Path('fixture-assets').rglob('*.apk') if 'androidTest' in p.parts];assert len(probes)==1
        with zipfile.ZipFile(probes[0]) as src,zipfile.ZipFile('/tmp/rebound-probe-unaligned.apk','w') as dest:
         assert 'assets/exact-candidate.apk' in src.namelist()
         for item in src.infolist():
          if item.filename.startswith('META-INF/') and (item.filename.endswith(('.RSA','.DSA','.EC','.SF')) or item.filename=='META-INF/MANIFEST.MF'):continue
          data=apk.read_bytes() if item.filename=='assets/exact-candidate.apk' else src.read(item.filename)
          dest.writestr(item,data)
        Path('settings-runtime-evidence/fixture-reuse-proof.txt').write_text('Original fixture and updater code match. Delivery source differs only by bidi isolation. Probe asset replaced with exact delivery APK and re-signed with original cert.\n')
        PYFILES
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        CANDIDATE_APK="$PWD/exact-candidate/app/build/outputs/apk/release/app-release.apk"
        FIXTURE_APK=$(find "$PWD/fixture-assets" -name '*.apk' -not -path '*/androidTest/*' | head -1)
        OLD_TEST_APK=$(find "$PWD/fixture-assets" -name '*.apk' -path '*/androidTest/*' | head -1)
        BASE_APK=$(find "$PWD/base-apk" -name '*.apk' | head -1)
        test -n "$FIXTURE_APK" && test -n "$OLD_TEST_APK" && test -n "$BASE_APK"
        for APK in "$FIXTURE_APK" "$OLD_TEST_APK" "$CANDIDATE_APK" "$BASE_APK"; do
         "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee -a settings-runtime-evidence/all-apk-certificates.txt
         "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689'
        done
        "$ANDROID_HOME/build-tools/$BT/zipalign" -f 4 /tmp/rebound-probe-unaligned.apk /tmp/rebound-probe-aligned.apk
        TEST_APK="$PWD/rebound-probe.apk"
        "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$WAQT_KEYSTORE_PATH" --ks-key-alias "$WAQT_KEY_ALIAS" --ks-pass env:WAQT_KEYSTORE_PASSWORD --key-pass env:WAQT_KEY_PASSWORD --out "$TEST_APK" /tmp/rebound-probe-aligned.apk
        "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$TEST_APK" | tee settings-runtime-evidence/rebound-probe-certificate.txt
        grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689' settings-runtime-evidence/rebound-probe-certificate.txt
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$FIXTURE_APK" > settings-runtime-evidence/fixture-package.txt
        grep -q "versionCode='104' versionName='5.6.78-fixture'" settings-runtime-evidence/fixture-package.txt
        for key in FIXTURE_APK TEST_APK CANDIDATE_APK BASE_APK; do echo "$key=${!key}" >> "$GITHUB_ENV"; done
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot test device
      env:
        API: '36'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/sdk-licenses.log || true
        if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_SDK_HOME="$HOME"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
        CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
        test -f "$CFG"
        echo 'hw.ramSize=3072' >> "$CFG"
        echo 'disk.dataPartition.size=4G' >> "$CFG"
        nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Verify exact signed settings in place then real updater to Android installer
      run: |
        set -euo pipefail
        adb shell wm size 1080x2400
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
        bash test_settings_runtime.sh
    - name: Preserve synthetic runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-settings-runtime-evidence
        path: |
          settings-runtime-evidence/
          /tmp/emulator.log
    - name: Publish synthetic screenshots and verdict for inspection
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p /tmp/settings-runtime-report
        if [ -d settings-runtime-evidence ]; then cp -R settings-runtime-evidence/. /tmp/settings-runtime-report/; fi
        cp /tmp/emulator.log /tmp/settings-runtime-report/emulator.log || true
        # The evidence branch contains synthetic data and logs, not APKs or private sources.
        find /tmp/settings-runtime-report -name '*.apk' -delete
        cd /tmp/settings-runtime-report
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable exact signed settings and installer runtime evidence' || true
        git branch -M "settings-runtime-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD
