name: Waqt 5.6.80 production startup and public upgrade gate
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/public-production-verify.yml
permissions:
  contents: write
  actions: read
jobs:
  production-startup-upgrade-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
    - name: Check accepted application lineage and version-only app change
      run: |
        set -euo pipefail
        git fetch --depth=1 origin af9c90263663d594805b97770bfd037cf3550f53
        git diff --exit-code af9c90263663d594805b97770bfd037cf3550f53 -- app/src
        python3 - <<'PY'
        import pathlib,subprocess
        old=subprocess.check_output(['git','show','af9c90263663d594805b97770bfd037cf3550f53:app/build.gradle.kts']).decode()
        expected=old.replace('versionCode = 105','versionCode = 106').replace('versionName = "5.6.79"','versionName = "5.6.80"')
        assert pathlib.Path('app/build.gradle.kts').read_text()==expected
        print('ACCEPTED_APP_SOURCE_IDENTICAL_EXCEPT_105_TO_106_VERSION=yes')
        PY
    - name: Apply bounded production startup guard and four regression tests
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import base64
        p=Path('app/src/main/java/com/example/glassproductivity/MainActivity.kt')
        s=p.read_text();old='        if (StartupRecovery.enterIfRecorded(this)) return'
        new='        // Diagnostic startup is explicit opt-in, never a trap for an old crash record.\n        if (intent?.getBooleanExtra("waqt_startup_diagnostic", false) == true &&\n            StartupRecovery.enterIfRecorded(this)) return'
        assert s.count(old)==1
        p.write_text(s.replace(old,new))
        Path('app/src/test/java/com/example/glassproductivity/StartupDiagnosticScopeTest.kt').write_bytes(base64.b64decode(''))
        PY
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add app/src/main/java/com/example/glassproductivity/MainActivity.kt app/src/test/java/com/example/glassproductivity/StartupDiagnosticScopeTest.kt
        git commit -m 'Keep startup diagnostics explicit opt-in for public release'
        echo "WAQT_TESTED_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: 45015447376
        name: waqt-settings-updater-candidate-not-yet-install-approved
        path: accepted-private105
    - name: Decode existing release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
    - name: Run complete regressions and build signed 5.6.80
      env:
        WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
        WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
        WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
        WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        mkdir -p release-proof
        gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee release-proof/build.log
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as X,json
        rows=[{k:r.get(k) for k in ['name','tests','failures','errors','skipped']} for r in [X.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]]
        assert rows and sum(int(r['tests']) for r in rows)>=70,rows
        assert all(int(r['failures'])==int(r['errors'])==int(r['skipped'])==0 for r in rows),rows
        updater=[r for r in rows if r['name'].endswith('WaqtUpdateSafetyTest')]
        assert updater and int(updater[0]['tests'])>=27,updater
        startup=[r for r in rows if r['name'].endswith('StartupDiagnosticScopeTest')]
        assert startup and int(startup[0]['tests'])==4,startup
        Path('release-proof/unit-verdict.json').write_text(json.dumps(rows,indent=2))
        print('ALL_UNIT_REGRESSIONS_PASS='+str(sum(int(r['tests']) for r in rows)))
        PY
    - name: Validate original public APK and new package certificate versions
      run: |
        set -euo pipefail
        curl -fL --retry 2 https://github.com/Madboly1/waqt/releases/download/v5.6.79/app-release.apk -o public105.apk
        echo '9e13b583646c650dbc2493f99943c2fd05af4ee0600bb04532e9e253eaca0cc8  public105.apk' | sha256sum -c -
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        for APK in public105.apk app/build/outputs/apk/release/app-release.apk; do
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee -a release-proof/certificates.txt
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689'
        done
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -E '^(package:|sdkVersion:|targetSdkVersion:)' | tee release-proof/package.txt
        grep -q "name='com.example.glassproductivity' versionCode='106' versionName='5.6.80'" release-proof/package.txt
        sha256sum app/build/outputs/apk/release/app-release.apk | tee release-proof/apk-sha256.txt
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot disposable API31 test device
      run: |
        set -euo pipefail
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /tmp/sdk-licenses.log || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-31;google_apis;x86_64'
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n publicupgrade -k 'system-images;android-31;google_apis;x86_64' --device pixel_5 --force
        echo 'hw.ramSize=3072' >> "$ANDROID_AVD_HOME/publicupgrade.avd/config.ini"
        echo 'disk.dataPartition.size=4G' >> "$ANDROID_AVD_HOME/publicupgrade.avd/config.ini"
        nohup "$ANDROID_HOME/emulator/emulator" -avd publicupgrade -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Verify real public105 and accepted105 populated upgrades to exact106
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import base64,pathlib
        pathlib.Path('/tmp/waqt_public_upgrade.py').write_bytes(base64.b64decode(''))
        PY
        python3 /tmp/waqt_public_upgrade.py
    - name: Persist exact verified startup safety source on feature branch only
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$WAQT_TESTED_SOURCE_SHA"
        git diff --exit-code -- app
        git push origin HEAD:feature/google-drive-backup
        test "$(git ls-remote origin refs/heads/feature/google-drive-backup | cut -f1)" = "$WAQT_TESTED_SOURCE_SHA"
        echo "VERIFIED_APP_SOURCE_PERSISTED=$WAQT_TESTED_SOURCE_SHA"
    - name: Capture failure diagnostics
      if: always()
      run: |
        adb logcat -d > release-proof/final-logcat.txt || true
        adb exec-out screencap -p > release-proof/final-screen.png || true
        cp /tmp/emulator.log release-proof/emulator.log || true
    - name: Keep exact signed candidate and synthetic evidence private
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-5.6.80-public-release-verified-candidate
        path: 'app/build/outputs/apk/release/app-release.apk

          release-proof/

          app/build/test-results/testDebugUnitTest/

          '
        retention-days: 14
    - name: Remove temporary signing key
      if: always()
      run: |
        rm -f "$RUNNER_TEMP/waqt-release.jks"
