name: Publish exact verified Waqt 5.6.80 update
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/public-update-publish.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: waqt-release-publish
  cancel-in-progress: false
jobs:
  publish-exact-verified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Confirm source gate passed and app code has not changed
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh api repos/Madboly1/waqt/actions/runs/45035266642 > /tmp/verified-run.json
        python3 - <<'PY'
        import json
        r=json.load(open('/tmp/verified-run.json'))
        assert r['status']=='completed' and r['conclusion']=='success',r
        assert r['head_sha']=='7c65dedbe19e480dbe8fe3ebfba3f34d58ae35c7',r
        assert r['path']=='.github/workflows/public-production-verify.yml',r
        PY
        git fetch --depth=1 origin dcc6ddc07885e5234a5f81c75acaf282e803c5cc
        git diff --exit-code dcc6ddc07885e5234a5f81c75acaf282e803c5cc -- app
        gh run download 45035266642 --repo Madboly1/waqt --name waqt-5.6.80-public-release-verified-candidate --dir verified
        python3 - <<'PY'
        from pathlib import Path
        import hashlib,json
        p=Path('verified/release-proof/release-proof.json');d=json.loads(p.read_text())
        a=Path('verified/app/build/outputs/apk/release/app-release.apk')
        expected='e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06'
        assert d['apk_sha256']==expected==hashlib.sha256(a.read_bytes()).hexdigest(),d
        assert d['source_commit']=='dcc6ddc07885e5234a5f81c75acaf282e803c5cc' and d['run_id']=='45035266642' and d['runtime_workflow_commit']=='7c65dedbe19e480dbe8fe3ebfba3f34d58ae35c7',d
        assert d['runtime_passed'] is True and d['version_code']==106 and d['version_name']=='5.6.80' and d['package']=='com.example.glassproductivity',d
        assert d['stale_unrelated_crash_normal_startup'] is True and d['diagnostic_scope_unit_tests']==4,d
        assert len(d['baseline_results'])==2 and {r['baseline'] for r in d['baseline_results']}=={'public105','accepted105'},d
        for r in d['baseline_results']:
         assert all(r[k] is True for k in ['upgrade','two_cold_launches','installed_apk_exact','existing_preferences_preserved','business_media_hashes_preserved','settings_version_visible']),r
        units=json.loads(Path('verified/release-proof/unit-verdict.json').read_text())
        assert sum(int(r['tests']) for r in units)>=70 and all(int(r['errors'])==int(r['failures'])==int(r['skipped'])==0 for r in units),units
        startup=[r for r in units if r['name'].endswith('StartupDiagnosticScopeTest')]
        assert startup and int(startup[0]['tests'])==4,startup
        print('EXACT_TESTED_ARTIFACT_ACCEPTED',expected,a.stat().st_size)
        PY
        APK=verified/app/build/outputs/apk/release/app-release.apk
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee /tmp/certificate.txt
        grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689' /tmp/certificate.txt
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E '^package:' | tee /tmp/package.txt
        grep -q "name='com.example.glassproductivity' versionCode='106' versionName='5.6.80'" /tmp/package.txt
    - name: Check existing OTA repository access before publication
      uses: actions/checkout@v4
      with:
        repository: Madboly1/waqt-updates
        ref: main
        token: ${{ secrets.UPDATE_REPO_TOKEN }}
        path: update-repo
    - name: Preflight current public feed version
      run: |
        python3 - <<'PY'
        import json
        d=json.load(open('update-repo/update.json'))
        assert d.get('app')=='WAQT' and 0<int(d['versionCode'])<=106,d
        if int(d['versionCode'])==106:
         assert d.get('sha256')=='e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06',d
        print('CURRENT_FEED_CODE',d['versionCode'])
        PY
    - name: Publish only the exact signed artifact that passed the upgrade gate
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG=v5.6.80
        APK=verified/app/build/outputs/apk/release/app-release.apk
        if gh release view "$TAG" --repo Madboly1/waqt --json tagName,isDraft,targetCommitish,assets > /tmp/release-before.json 2>/tmp/release-lookup.log; then
          gh api repos/Madboly1/waqt/commits/$TAG --jq .sha > /tmp/existing-tag-commit.txt
          grep -qx dcc6ddc07885e5234a5f81c75acaf282e803c5cc /tmp/existing-tag-commit.txt
        else
          if ! grep -q 'release not found' /tmp/release-lookup.log; then cat /tmp/release-lookup.log; exit 1; fi
          gh release create "$TAG" --repo Madboly1/waqt --target dcc6ddc07885e5234a5f81c75acaf282e803c5cc --draft --title 'WAQT 5.6.80' --notes 'WAQT Android release 5.6.80 (versionCode 106).'
        fi
        gh release view "$TAG" --repo Madboly1/waqt --json isDraft,assets > /tmp/release-current.json
        if python3 -c 'import json;d=json.load(open("/tmp/release-current.json"));raise SystemExit(0 if any(a["name"]=="app-release.apk" for a in d["assets"]) else 1)'; then
          mkdir -p existing-release-check
          gh release download "$TAG" --repo Madboly1/waqt --pattern app-release.apk --dir existing-release-check
          echo 'e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06  existing-release-check/app-release.apk' | sha256sum -c -
        else
          python3 -c 'import json;assert json.load(open("/tmp/release-current.json"))["isDraft"] is True'
          gh release upload "$TAG" "$APK#app-release.apk" --repo Madboly1/waqt
        fi
        mkdir -p draft-download-check
        gh release download "$TAG" --repo Madboly1/waqt --pattern app-release.apk --dir draft-download-check
        echo 'e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06  draft-download-check/app-release.apk' | sha256sum -c -
        gh release edit "$TAG" --repo Madboly1/waqt --draft=false --latest
        gh api repos/Madboly1/waqt/releases/tags/$TAG > /tmp/published-release.json
        python3 - <<'PY'
        import json,os
        r=json.load(open('/tmp/published-release.json'));assert not r['draft'] and not r['prerelease'],r
        a=next(a for a in r['assets'] if a['name']=='app-release.apk')
        assert a['size']>7000000,a
        with open(os.environ['GITHUB_ENV'],'a') as f:
         f.write('PUBLISHED_APK_URL='+a['browser_download_url']+chr(10))
         f.write('PUBLISHED_RELEASE_URL='+r['html_url']+chr(10))
        print('PUBLIC_RELEASE',r['html_url']);print('PUBLIC_APK',a['browser_download_url'])
        PY
    - name: Verify anonymous public download before feed activation
      run: |
        set -euo pipefail
        curl -fL --retry 3 "$PUBLISHED_APK_URL" -o /tmp/public-download.apk
        echo 'e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06  /tmp/public-download.apk' | sha256sum -c -
    - name: Activate digest-bearing OTA metadata without changing other fields
      run: |
        set -euo pipefail
        cd update-repo
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        for attempt in 1 2 3 4 5; do
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
        import json,os,pathlib,copy
        p=pathlib.Path('update.json');old=json.loads(p.read_text());d=copy.deepcopy(old)
        assert d.get('app')=='WAQT' and int(d['versionCode'])<=106,d
        if int(d['versionCode'])==106:
         assert d.get('sha256')=='e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06',d
        d.update(versionCode=106,versionName='5.6.80',apkDownloadUrl=os.environ['PUBLISHED_APK_URL'],sha256='e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06')
        changed={k for k in set(d)|set(old) if d.get(k)!=old.get(k)}
        assert changed<={'versionCode','versionName','apkDownloadUrl','sha256'},changed
        p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+chr(10))
        print('OTA_CHANGED_FIELDS',sorted(changed))
        PY
          git add update.json
          if git diff --cached --quiet; then echo 'OTA_ALREADY_CURRENT=yes'; break; fi
          git commit -m 'Publish WAQT 5.6.80 update metadata'
          if git push origin HEAD:main; then echo 'OTA_PUSHED=yes'; break; fi
          if [ "$attempt" = 5 ]; then exit 1; fi
          sleep $((attempt * 2))
        done
    - name: Confirm canonical updater URL serves the new digest and version
      run: |
        set -euo pipefail
        for attempt in $(seq 1 12); do
          curl -fsSL https://raw.githubusercontent.com/Madboly1/waqt-updates/main/update.json -o /tmp/live-update.json
          if python3 - <<'PY'
        import json,os
        d=json.load(open('/tmp/live-update.json'))
        assert d['versionCode']==106 and d['versionName']=='5.6.80' and d['sha256']=='e4aa71ab1847180291d821458dd0b37088a506d65fac0419b3ff986336d66d06' and d['apkDownloadUrl']==os.environ['PUBLISHED_APK_URL'],d
        print('CANONICAL_LIVE_FEED_VERIFIED=yes')
        PY
          then break; fi
          if [ "$attempt" = 12 ]; then exit 1; fi
          sleep 30
        done
        mkdir -p publication-proof
        cp /tmp/published-release.json /tmp/live-update.json /tmp/certificate.txt /tmp/package.txt publication-proof/
        cp verified/release-proof/release-proof.json verified/release-proof/unit-verdict.json publication-proof/
        echo "PUBLICATION_COMPLETE=$PUBLISHED_RELEASE_URL" | tee publication-proof/verdict.txt
    - name: Keep publication verification record
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-5.6.80-publication-proof
        path: publication-proof/
        retention-days: 14
