name: WAQT Account Screen and Signed Build Check
# Last triggered for swipe probe verification after currentEpochDay compile fix.

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: 'Also run the signed-build-only job'
        required: false
        default: 'true'
  push:
    branches:
      - feature/google-drive-backup
    paths:
      - .github/workflows/account-screen-check.yml

permissions:
  contents: write

jobs:
  account-screens:
    # Opt out of the emulator harness for a given push with [no-screens] in
    # the commit message (e.g. signed-build-only runs).
    if: ${{ !contains(github.event.head_commit.message, '[no-screens]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Install emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Create and boot AVD
        run: |
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n acct -k "system-images;android-31;google_apis;x86_64" --device "pixel_5" --force
          CFG="$ANDROID_AVD_HOME/acct.avd/config.ini"
          if [ ! -f "$CFG" ]; then
            CFG=$(find "$HOME" /usr/local/lib/android -maxdepth 6 -path "*acct.avd/config.ini" 2>/dev/null | head -1)
          fi
          if [ -z "$CFG" ] || [ ! -f "$CFG" ]; then
            echo "acct AVD config.ini not found"; exit 1
          fi
          export ANDROID_AVD_HOME="$(dirname "$(dirname "$CFG")")"
          echo "hw.ramSize=3072" >> "$CFG"
          echo "disk.dataPartition.size=4G" >> "$CFG"
          nohup emulator -avd acct -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "booted after $((i*5))s"; break; fi
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "EMULATOR BOOT TIMEOUT"; tail -50 /tmp/emulator.log || true; exit 1
          fi
      - name: Exercise account screens and back behavior
        run: |
          set -x
          mkdir -p shots
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm clear com.example.glassproductivity
          adb logcat -c
          adb shell am start -n com.example.glassproductivity/.MainActivity
          sleep 12

          # Tour visual verification on first launch (before dismissal):
          # overlay must be up with its pager; capture two pages as evidence.
          adb shell uiautomator dump /sdcard/uiv.xml >/dev/null 2>&1
          adb pull /sdcard/uiv.xml /tmp/uiv.xml >/dev/null 2>&1 || true
          adb exec-out screencap -p > shots/00_tour_first_page.png
          if grep -q "من 7" /tmp/uiv.xml 2>/dev/null; then echo "TOUR_SHOWN=yes" > /tmp/tour_visual.txt; else echo "TOUR_SHOWN=no" > /tmp/tour_visual.txt; fi
          cat /tmp/tour_visual.txt

          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1
            python3 - "$1" <<'PY' > /tmp/tap.txt
          import re, sys
          target = sys.argv[1]
          xml = open('ui.xml', encoding='utf-8').read()
          for m in re.finditer(r'<node\b[^>]*>', xml):
              tag = m.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              dm = re.search(r'content-desc="([^"]*)"', tag)
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              cm = re.search(r'clickable="(true|false)"', tag)
              if not bm:
                  continue
              val = (tm.group(1) if tm else '') + ' ' + (dm.group(1) if dm else '')
              if target in val:
                  x = (int(bm.group(1)) + int(bm.group(3))) // 2
                  y = (int(bm.group(2)) + int(bm.group(4))) // 2
                  score = 10 if (cm and cm.group(1) == 'true') else 0
                  if val.strip() == target:
                      score += 1
                  print(score, x, y)
          PY
          }
          try_tap() {
            tap_text "$1"
            read _SCORE X Y < <(sort -rn /tmp/tap.txt | head -1) || true
            if [ -n "${X:-}" ]; then adb shell input tap $X $Y; unset X Y; return 0; fi
            unset X Y; return 1
          }
          scroll_until() {
            for i in $(seq 1 8); do
              if try_tap "$1"; then return 0; fi
              adb shell input swipe 540 1700 540 700
              sleep 2
            done
            return 1
          }

          # Dismiss first-run tour if present (skip button text is "تخطَّ" in the dump)
          for i in 1 2 3 4; do
            try_tap "تخط" && break
            sleep 2
          done
          sleep 2
          adb shell uiautomator dump /sdcard/uit.xml >/dev/null 2>&1
          adb pull /sdcard/uit.xml /tmp/uit.xml >/dev/null 2>&1 || true
          if grep -q "من 7" /tmp/uit.xml 2>/dev/null; then
            # Coordinate fallback; geometry verified from run 44846731442 dump: skip button bounds [82,2021][201,2072]
            adb shell input tap 141 2046
            sleep 3
            adb shell uiautomator dump /sdcard/uit.xml >/dev/null 2>&1
            adb pull /sdcard/uit.xml /tmp/uit.xml >/dev/null 2>&1 || true
          fi
          adb exec-out screencap -p > shots/01_home.png
          if grep -q "من 7" /tmp/uit.xml 2>/dev/null; then
            echo "TOUR_DISMISSED=no" > shots/results.txt
            cat shots/results.txt
            exit 1
          fi
          echo "TOUR_DISMISSED=yes" > /tmp/tour_state.txt
          cat /tmp/tour_state.txt /tmp/tour_visual.txt
          grep -q '^TOUR_SHOWN=yes$' /tmp/tour_visual.txt

          # Floating-ball drag + tab-swipe interaction probe (runtime evidence for
          # the tab-swipe steal fix: ball drags must not start tab swipes; real
          # content-area swipes must still switch tabs).
          adb shell uiautomator dump /sdcard/uib.xml >/dev/null 2>&1
          adb pull /sdcard/uib.xml /tmp/uib.xml >/dev/null 2>&1 || true
          BALL=$(python3 - <<'PYB'
          import re
          try:
              xml = open('/tmp/uib.xml', encoding='utf-8').read()
          except Exception:
              xml = ''
          for m in re.finditer(r'<node\b[^>]*>', xml):
              tag = m.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              if tm and tm.group(1) == '\u2726' and bm:
                  x = (int(bm.group(1))+int(bm.group(3)))//2
                  y = (int(bm.group(2))+int(bm.group(4)))//2
                  print(f"{x} {y}")
                  break
          PYB
          )
          if [ -z "$BALL" ]; then
            echo "BALL_FOUND=no" | tee shots/swipe_probe.txt
          else
            read BX BY <<< "$BALL"
            echo "BALL_FOUND=yes at $BX,$BY" | tee shots/swipe_probe.txt
            adb logcat -c
            adb shell input swipe $BX $BY $((BX+260)) $((BY+120)) 700
            sleep 2
            adb exec-out screencap -p > shots/10_ball_dragged.png
            adb logcat -d > shots/swipe_probe_ball_logcat.txt
            if grep -q 'ACTIVITY_SWIPE_DOWN eligible=false' shots/swipe_probe_ball_logcat.txt; then echo "BALL_DRAG_EXCLUDED=yes" | tee -a shots/swipe_probe.txt; else echo "BALL_DRAG_EXCLUDED=no" | tee -a shots/swipe_probe.txt; fi
            if grep -q 'SWIPE_CREATED' shots/swipe_probe_ball_logcat.txt; then echo "BALL_DRAG_TAB_SWITCH=yes_BUG" | tee -a shots/swipe_probe.txt; else echo "BALL_DRAG_TAB_SWITCH=no" | tee -a shots/swipe_probe.txt; fi
            adb logcat -c
            adb shell input swipe 250 1780 700 1780 350
            sleep 2
            adb exec-out screencap -p > shots/11_tab_swiped.png
            adb logcat -d > shots/swipe_probe_tab_logcat.txt
            if grep -q 'SWIPE_CREATED' shots/swipe_probe_tab_logcat.txt; then echo "TAB_SWIPE_WORKS=yes" | tee -a shots/swipe_probe.txt; else echo "TAB_SWIPE_WORKS=no" | tee -a shots/swipe_probe.txt; fi
          fi
          cat shots/swipe_probe.txt

          # Acceptance assertions: the job must FAIL when the swipe-fix checks
          # could not be verified - evidence alone is not a pass.
          grep -q '^BALL_FOUND=yes' shots/swipe_probe.txt
          grep -q '^BALL_DRAG_EXCLUDED=yes$' shots/swipe_probe.txt
          grep -q '^BALL_DRAG_TAB_SWITCH=no$' shots/swipe_probe.txt
          grep -q '^TAB_SWIPE_WORKS=yes$' shots/swipe_probe.txt

          # Reminder-scheduling runtime signal (evidence only): capture pending
          # alarms for the app after boot so the scheduled trigger times can be
          # cross-checked against due dates outside the unit tests.
          adb shell dumpsys alarm > shots/alarm_dump.txt || true
          grep -n 'com.example.glassproductivity' shots/alarm_dump.txt > shots/alarm_hits.txt || true

          # Record pre-test persisted state (debug build allows run-as)
          adb shell "run-as com.example.glassproductivity sh -c 'ls -la shared_prefs'" > shots/prefs_before.txt 2>/dev/null || true
          adb shell "run-as com.example.glassproductivity sh -c 'cat shared_prefs/*.xml 2>/dev/null'" | md5sum > shots/prefs_before.md5 || true

          # Open settings via gear button (home body is one custom view; gear at image (75,170) -> device (111,252))
          try_tap "⚙" || adb shell input tap 111 252 || true
          sleep 4
          adb exec-out screencap -p > shots/02_settings_top.png

          # Account accordion section
          if ! scroll_until "حساب جوجل والنسخ السحابي"; then
            adb shell uiautomator dump /sdcard/uinav.xml >/dev/null 2>&1
            adb pull /sdcard/uinav.xml shots/ui_nav_blocker.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > shots/03_account_section.png
            { cat /tmp/tour_state.txt; echo "NAV_BLOCKER=account_section"; } > shots/results.txt
            cat shots/results.txt
            exit 1
          fi
          sleep 3
          adb exec-out screencap -p > shots/03_account_section.png

          # Tap sign-in: expect system Credential Manager / add-account UI, no account configured
          if ! try_tap "تسجيل الدخول بحساب جوجل"; then
            adb shell uiautomator dump /sdcard/uinav.xml >/dev/null 2>&1
            adb pull /sdcard/uinav.xml shots/ui_nav_blocker.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > shots/04_signin_prompt.png
            { cat /tmp/tour_state.txt; echo "NAV_BLOCKER=signin_button"; } > shots/results.txt
            cat shots/results.txt
            exit 1
          fi
          sleep 8
          adb exec-out screencap -p > shots/04_signin_prompt.png
          adb shell uiautomator dump /sdcard/ui2.xml >/dev/null 2>&1
          adb pull /sdcard/ui2.xml shots/ui_at_signin.xml >/dev/null 2>&1 || true
          adb shell input keyevent 4
          sleep 2

          # Data & backup accordion section
          scroll_until "بياناتك والنسخ الاحتياطي" || true
          sleep 3
          adb exec-out screencap -p > shots/05_data_backup_section.png

          # Return home
          adb shell input keyevent 4
          sleep 2
          adb exec-out screencap -p > shots/06_back_at_home.png

          # Back-behavior test: single back must keep app foreground with toast
          adb shell input keyevent 4
          sleep 1
          adb exec-out screencap -p > shots/07_single_back.png
          FOCUS1=$(adb shell dumpsys window | grep -m1 mCurrentFocus || true)
          PID1=$(adb shell pidof com.example.glassproductivity || true)
          # Second back quickly: app should background (double-back-to-exit guard)
          adb shell input keyevent 4
          sleep 2
          adb exec-out screencap -p > shots/08_double_back.png
          FOCUS2=$(adb shell dumpsys window | grep -m1 mCurrentFocus || true)
          PID2=$(adb shell pidof com.example.glassproductivity || true)

          # Reopen and verify state preserved (home without tour overlay)
          adb shell am start -n com.example.glassproductivity/.MainActivity
          sleep 8
          adb exec-out screencap -p > shots/09_reopened.png
          adb shell uiautomator dump /sdcard/ui3.xml >/dev/null 2>&1
          adb pull /sdcard/ui3.xml shots/ui_reopened.xml >/dev/null 2>&1 || true
          FOCUS3=$(adb shell dumpsys window | grep -m1 mCurrentFocus || true)
          PID3=$(adb shell pidof com.example.glassproductivity || true)
          adb shell "run-as com.example.glassproductivity sh -c 'ls -la shared_prefs'" > shots/prefs_after.txt 2>/dev/null || true
          adb shell "run-as com.example.glassproductivity sh -c 'cat shared_prefs/*.xml 2>/dev/null'" | md5sum > shots/prefs_after.md5 || true

          # Crash evidence from logcat
          adb logcat -d > shots/logcat_full.txt || true
          grep -E 'FATAL EXCEPTION|beginning of crash' shots/logcat_full.txt > shots/crash_hits.txt || true

          {
            echo "FOCUS_AFTER_SINGLE_BACK=$FOCUS1"
            echo "PID_AFTER_SINGLE_BACK=${PID1:-gone}"
            echo "FOCUS_AFTER_DOUBLE_BACK=$FOCUS2"
            echo "PID_AFTER_DOUBLE_BACK=${PID2:-gone}"
            echo "FOCUS_AFTER_REOPEN=$FOCUS3"
            echo "PID_AFTER_REOPEN=${PID3:-gone}"
            echo "PREFS_BEFORE_MD5=$(cat shots/prefs_before.md5 2>/dev/null)"
            echo "PREFS_AFTER_MD5=$(cat shots/prefs_after.md5 2>/dev/null)"
            echo "CRASH_HITS=$(wc -l < shots/crash_hits.txt)"
            cat /tmp/tour_state.txt
          } > shots/results.txt
          cat shots/results.txt
      - name: Alarm registration and delivery probe
        run: |
          set -e
          # Reminder runtime probe on the disposable emulator:
          #  A) a task due TOMORROW must register its alarm on tomorrow's date
          #     (runtime evidence for the future-due-date fix, which unit tests
          #     cover only at the Robolectric level)
          #  B) a task due TODAY a few minutes ahead must actually DELIVER:
          #     AlarmReceiver fires and the alarm notification is posted.
          # Injection goes through shared_prefs on the debug build; no app
          # code changes, no real accounts, no user data.
          python3 - <<'PYINJ'
          import json, re, subprocess, time, datetime, base64, sys
          from xml.sax.saxutils import escape as xesc, unescape as xunesc

          PKG = "com.example.glassproductivity"
          PREFS = "shared_prefs/waqt_productivity_prefs.xml"

          def sh(*args, inp=None):
              r = subprocess.run(["adb"] + list(args), capture_output=True, text=True, input=inp)
              return r.stdout

          def app_epoch(y, m, d):
                doy = datetime.date(y, m, d).timetuple().tm_yday
                return y * 366 + doy

          # Device clock. adb joins all args with spaces on the device shell,
          # so a date format containing spaces arrives as several extra args
          # and the command fails with empty stdout. Use a dash-separated
          # format, and retry while the device settles.
          raw = ""
          mclock = None
          for attempt in range(10):
              raw = sh("shell", "date", "+%Y-%m-%d-%H-%M-%s-%z").strip()
              mclock = re.match(r"^(\d{4})-(\d{2})-(\d{2})-(\d{2})-(\d{2})-(\d+)-([+-])(\d{2})(\d{2})$", raw)
              if mclock:
                  break
              print("date attempt", attempt, "bad output:", repr(raw))
              time.sleep(2)
          if not mclock:
              print("FATAL: could not read device clock; last output:", repr(raw))
              sys.exit(1)
          Y, M, D, H, Mi, now_s = (int(mclock.group(i)) for i in range(1, 7))
          tzs_sign = 1 if mclock.group(7) == "+" else -1
          tz_off = tzs_sign * (int(mclock.group(8)) * 3600 + int(mclock.group(9)) * 60)

          # Delivery probe: today, ~3.5 min ahead
          dt_now = datetime.datetime(Y, M, D, H, Mi)
          dt_del = dt_now + datetime.timedelta(seconds=210)
          del_epoch = app_epoch(dt_del.year, dt_del.month, dt_del.day)

          # Future-due probe: tomorrow 09:37 emulator-local, pre-alert 09:24
          dt_tom = dt_now + datetime.timedelta(days=1)
          fut_epoch = app_epoch(dt_tom.year, dt_tom.month, dt_tom.day)
          exp_trigger = int((datetime.datetime(dt_tom.year, dt_tom.month, dt_tom.day, 9, 37)
                             - datetime.datetime(1970, 1, 1)).total_seconds()) - tz_off
          exp_pre = int((datetime.datetime(dt_tom.year, dt_tom.month, dt_tom.day, 9, 24)
                         - datetime.datetime(1970, 1, 1)).total_seconds()) - tz_off

          def item(i, title, h, m, due):
              return {"id": i, "title": title, "isHabit": False, "hour": h, "minute": m,
                      "streakCount": 0, "streakGoal": 7, "priority": "medium", "category": "work",
                      "lastCompletedEpochDay": -1, "isCompletedToday": False, "description": "",
                      "dueDateEpochDay": due, "dueDateString": "", "expectedMinutes": 25,
                      "actualFocusedMinutes": 0, "focusSessionsCount": 0, "recurrence": "once",
                      "customDaysCsv": "1,2,3,4,5,6,7", "targetValue": 1, "currentProgressToday": 0,
                      "targetUnit": "", "longestStreak": 0, "isPaused": False, "hasReminder": True,
                      "completedDaysHistoryCsv": "", "completionPercentage": 0, "deferredUntilMillis": 0}

          sh("shell", "am", "force-stop", PKG)
          time.sleep(2)
          xml = sh("shell", "run-as", PKG, "cat", PREFS)
          print("prefs bytes:", len(xml))
          # Non-greedy capture: a greedy (.*) would run past this element to
          # the last </string> in the file and corrupt the splice.
          mobj = re.search(r'<string name="waqt_items_json">(.*?)</string>', xml, re.S)
          items = []
          if mobj:
              try:
                  items = json.loads(xunesc(mobj.group(1), {"&quot;": chr(34), "&apos;": chr(39)}))
              except Exception as e:
                  print("WARN: existing waqt_items_json unparsable:", repr(e))
                  items = []
          items = [x for x in items if x.get("id") not in ("ci-future-due-probe", "ci-delivery-probe")]
          items.append(item("ci-future-due-probe", "CI future due probe", 9, 37, fut_epoch))
          items.append(item("ci-delivery-probe", "CI delivery probe", dt_del.hour, dt_del.minute, del_epoch))
          new_json_xml = xesc(json.dumps(items, separators=(",", ":")))
          if mobj:
              new_xml = xml[:mobj.start(1)] + new_json_xml + xml[mobj.end(1):]
          elif "</map>" in xml:
              new_xml = xml.replace("</map>", '<string name="waqt_items_json">' + new_json_xml + '</string></map>')
          else:
              new_xml = "<?xml version='1.0' encoding='utf-8' standalone='yes' ?>\n<map><string name=\"waqt_items_json\">" + new_json_xml + "</string></map>\n"
          print("items injected:", len(items), "key existed:", bool(mobj))
          # Distinctive pre-alert (13 min instead of default 10) so the registration
          # check can require the 09:37 trigger AND its 09:24 pre-alert, tying both
          # alarms to the injected task rather than any other app alarm.
          if 'name="waqt_pre_alert_minutes"' not in new_xml:
              new_xml = new_xml.replace('</map>', '<int name="waqt_pre_alert_minutes" value="13" /></map>')
          b64 = base64.b64encode(new_xml.encode()).decode()
          sh("shell", "run-as", PKG, "sh", "-c", "base64 -d > " + PREFS, inp=b64)

          with open("/tmp/alarm_probe_env.txt", "w") as f:
              f.write(f"EXP_TRIGGER={exp_trigger}\nEXP_PRE={exp_pre}\nDELIVERY_AT={dt_del.hour:02d}:{dt_del.minute:02d}\n")
          print("injected", len(items), "items; expect future trigger", exp_trigger,
                "pre", exp_pre, "delivery at", f"{dt_del.hour:02d}:{dt_del.minute:02d}")
          PYINJ
          cat /tmp/alarm_probe_env.txt

          # Fresh app launch so notification channels exist and the process is
          # out of stopped state, then a protected TIME_SET broadcast makes
          # AlarmReceiver re-schedule every stored reminder.
          adb root >/dev/null 2>&1 || true
          sleep 3
          adb wait-for-device
          adb shell am start -n com.example.glassproductivity/.MainActivity >/dev/null
          sleep 6
          adb shell dumpsys notification --noredact > shots/notif_baseline.txt || true
          adb shell am broadcast -a android.intent.action.TIME_SET -p com.example.glassproductivity -f 32 >/dev/null
          sleep 8

          adb shell dumpsys alarm > shots/alarm_dump2.txt || true
          grep -n 'com.example.glassproductivity' shots/alarm_dump2.txt > shots/alarm_hits2.txt || true
          python3 - <<'PYVER'
          import re, sys
          exp = None
          exp_pre = None
          for line in open("/tmp/alarm_probe_env.txt"):
              if line.startswith("EXP_TRIGGER="):
                  exp = int(line.strip().split("=")[1])
              if line.startswith("EXP_PRE="):
                  exp_pre = int(line.strip().split("=")[1])
          hits = open("shots/alarm_hits2.txt").read()
          nums = [int(n) for n in re.findall(r"\b(1[0-9]{12})\b", hits)]
          ok = any(abs(n // 1000 - exp) <= 120 for n in nums) and \
               any(abs(n // 1000 - exp_pre) <= 120 for n in nums)
          with open("shots/alarm_probe.txt", "w") as f:
              f.write("ALARM_PROBE_SETUP=ok\n")
              f.write(f"FUTURE_DUE_EXPECTED={exp}\n")
              f.write("FUTURE_DUE_FOUND_TRIGGERS=" + ",".join(str(n) for n in nums) + "\n")
              f.write("FUTURE_DUE_REGISTERED=" + ("yes" if ok else "no") + "\n")
          print(open("shots/alarm_probe.txt").read())
          if not ok:
              sys.exit(1)
          PYVER

          # Wait for the delivery probe to fire, then check posted notifications
          sleep 230
          adb shell dumpsys notification --noredact > shots/notif_dump.txt || true
          # Delivery evidence must name the injected probe task and be new
          # relative to the pre-broadcast baseline, not any prior notification.
          TITLE_HITS=$(grep -c 'CI delivery probe' shots/notif_dump.txt || true)
          BASE_TITLE_HITS=$(grep -c 'CI delivery probe' shots/notif_baseline.txt || true)
          PKG_AFTER=$(grep -c 'com.example.glassproductivity' shots/notif_dump.txt || true)
          PKG_BEFORE=$(grep -c 'com.example.glassproductivity' shots/notif_baseline.txt || true)
          DELIVERED=no
          if [ "${TITLE_HITS:-0}" -gt "${BASE_TITLE_HITS:-0}" ] && [ "${PKG_AFTER:-0}" -gt "${PKG_BEFORE:-0}" ]; then DELIVERED=yes; fi
          echo "ALARM_DELIVERED=$DELIVERED" >> shots/alarm_probe.txt
          echo "NOTIF_TITLE_HITS=$TITLE_HITS BASELINE=$BASE_TITLE_HITS PKG_AFTER=$PKG_AFTER PKG_BEFORE=$PKG_BEFORE" >> shots/alarm_probe.txt
          cat shots/alarm_probe.txt
          [ "$DELIVERED" = "yes" ]

      - name: Local backup restore round-trip (synthetic data)
        if: ${{ !cancelled() }}
        run: |
          set -e
          # Local (non-Drive) backup round-trip with synthetic data:
          # restore a crafted WAQT backup file through the real SAF picker UI,
          # then verify prefs were REPLACED by the backup contents. This covers
          # the local JSON path only; the Drive/ZIP path needs real OAuth and
          # is intentionally not covered here.
          python3 - <<'PYBAK'
          import json
          root = {"app":"WAQT","schemaVersion":4,"timestamp":1763800000000,
                  "items":[{"id":"ci-restore-probe","title":"CI restore probe task","isHabit":False,"hour":8,"minute":15,"streakCount":0,"streakGoal":7,"priority":"high","category":"work","lastCompletedEpochDay":-1,"isCompletedToday":False,"description":"","dueDateEpochDay":741816,"dueDateString":"","expectedMinutes":25,"actualFocusedMinutes":0,"focusSessionsCount":0,"recurrence":"once","customDaysCsv":"1,2,3,4,5,6,7","targetValue":1,"currentProgressToday":0,"targetUnit":"","longestStreak":0,"isPaused":False,"hasReminder":False,"completedDaysHistoryCsv":"","completionPercentage":0,"deferredUntilMillis":0}],
                  "notes":[],"habitCategories":[],"customQuotes":[],
                  "settings":{"pref_dark_mode":True,"pref_accent_color":"#FF8A3D","pref_default_focus_mins":25,"pref_default_break_mins":5,"pref_daily_focus_goal_mins":120,"pref_notif_tasks":True,"pref_notif_habits":True}}
          open("/tmp/waqt_ci_restore.json","w").write(json.dumps(root, indent=2))
          PYBAK
          adb push /tmp/waqt_ci_restore.json /sdcard/Download/waqt_ci_restore.json
          adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/waqt_ci_restore.json >/dev/null 2>&1 || true

          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1
            python3 - "$1" <<'PY' > /tmp/tap.txt
          import re, sys
          target = sys.argv[1]
          xml = open('ui.xml', encoding='utf-8').read()
          for m in re.finditer(r'<node\b[^>]*>', xml):
              tag = m.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              dm = re.search(r'content-desc="([^"]*)"', tag)
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              cm = re.search(r'clickable="(true|false)"', tag)
              if not bm:
                  continue
              val = (tm.group(1) if tm else '') + ' ' + (dm.group(1) if dm else '')
              if target in val:
                  x = (int(bm.group(1)) + int(bm.group(3))) // 2
                  y = (int(bm.group(2)) + int(bm.group(4))) // 2
                  score = 10 if (cm and cm.group(1) == 'true') else 0
                  if val.strip() == target:
                      score += 1
                  print(score, x, y)
          PY
          }
          try_tap() {
            tap_text "$1"
            read _SCORE X Y < <(sort -rn /tmp/tap.txt | head -1) || true
            if [ -n "${X:-}" ]; then adb shell input tap $X $Y; unset X Y; return 0; fi
            unset X Y; return 1
          }
          scroll_until() {
            for i in $(seq 1 8); do
              if try_tap "$1"; then return 0; fi
              adb shell input swipe 540 1700 540 700
              sleep 2
            done
            return 1
          }

          adb shell am start -n com.example.glassproductivity/.MainActivity >/dev/null
          sleep 6
          try_tap "⚙" || adb shell input tap 111 252 || true
          sleep 4
          scroll_until "بياناتك والنسخ الاحتياطي"
          sleep 3
          scroll_until "استعادة نسخة احتياطية من ملف"
          sleep 6
          adb exec-out screencap -p > shots/12_saf_picker.png
          try_tap "waqt_ci_restore.json"
          sleep 4
          adb exec-out screencap -p > shots/13_restore_confirm.png
          try_tap "استعادة"
          sleep 4
          adb exec-out screencap -p > shots/14_restored.png

          adb shell run-as com.example.glassproductivity cat shared_prefs/waqt_productivity_prefs.xml > /tmp/prefs_restored.xml
          {
            if grep -q 'CI restore probe task' /tmp/prefs_restored.xml && ! grep -q 'ci-future-due-probe' /tmp/prefs_restored.xml; then
              echo "BACKUP_RESTORED=yes"
            else
              echo "BACKUP_RESTORED=no"
            fi
          } > shots/backup_probe.txt
          cat shots/backup_probe.txt
          grep -q '^BACKUP_RESTORED=yes$' shots/backup_probe.txt

          # Export path evidence: the share sheet must open from the real button.
          # Content past the share-sheet boundary is not machine-verifiable here;
          # that limit is reported, not asserted.
          scroll_until "مشاركة نسخة احتياطية (نص)"
          sleep 5
          adb shell uiautomator dump /sdcard/uishare.xml >/dev/null 2>&1
          adb pull /sdcard/uishare.xml /tmp/uishare.xml >/dev/null 2>&1 || true
          adb exec-out screencap -p > shots/15_share_sheet.png
          if grep -qi 'intentresolver\|chooser\|نسخة وقت الاحتياطية' /tmp/uishare.xml 2>/dev/null; then
            echo "BACKUP_EXPORT_SHEET=yes" >> shots/backup_probe.txt
          else
            echo "BACKUP_EXPORT_SHEET=no" >> shots/backup_probe.txt
          fi
          adb shell input keyevent 4 || true
          cat shots/backup_probe.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-shots
          path: shots/
      - name: Push shots to evidence branch
        if: always()
        run: |
          set -e
          BR="account-evidence-r${{ github.run_id }}"
          mkdir -p /tmp/ev
          cp shots/* /tmp/ev/ 2>/dev/null || true
          cd /tmp/ev
          git init -b "$BR" .
          git config user.email "ci@waqt.local"
          git config user.name "waqt-account-ci"
          git add .
          git commit -m "Account screen evidence for run ${{ github.run_id }} (head ${{ github.sha }})" || true
          PUSH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push "$PUSH_URL" "$BR:$BR"
      - name: Emulator log on failure
        if: failure()
        run: tail -100 /tmp/emulator.log || true

  signed-build-only:
    if: ${{ !contains(github.event.head_commit.message, '[no-signed]') && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_signed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Decode signing key to runner temp
        env:
          KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing WAQT_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
          test -s "$RUNNER_TEMP/waqt-release.jks"
      - name: Build signed release APK (no OTA, no store, no release)
        env:
          WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
          WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
          WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
          WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package, signature, size
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          SHA1=$(grep -m1 -oiE 'certificate SHA-1 digest: [0-9a-f:]+' certs.txt | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/..\B/&:/g;s/::*/:/g')
          EXPECTED="E1:63:0B:27:C1:71:6D:6A:F2:0A:BE:E8:B0:9C:46:E6:49:D0:9F:E6"
          echo "COMPUTED_SHA1=$SHA1"
          echo "EXPECTED_SHA1=$EXPECTED"
          if [ "$SHA1" != "$EXPECTED" ]; then echo "SIGNATURE MISMATCH"; exit 1; fi
          echo "SIGNATURE MATCHES PUBLISHED APP"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E 'package:|application-label:' | tee package.txt
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" | tee size.txt
      - name: Upload signed APK artifact (Actions only, never published)
        uses: actions/upload-artifact@v4
        with:
          name: waqt-signed-release-no-ota
          path: app/build/outputs/apk/release/app-release.apk
