  signed-build-only:
    if: ${{ !contains(github.event.head_commit.message, '[no-signed]') && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_signed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Decode signing key to runner temp
        env:
          KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing WAQT_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
          test -s "$RUNNER_TEMP/waqt-release.jks"
      - name: Build signed release APK (no OTA, no store, no release)
        env:
          WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
          WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
          WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
          WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify package, signature, size
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          SHA1=$(grep -m1 -oiE 'certificate SHA-1 digest: [0-9a-f:]+' certs.txt | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/..\B/&:/g;s/::*/:/g')
          EXPECTED="E1:63:0B:27:C1:71:6D:6A:F2:0A:BE:E8:B0:9C:46:E6:49:D0:9F:E6"
          echo "COMPUTED_SHA1=$SHA1"
          echo "EXPECTED_SHA1=$EXPECTED"
          if [ "$SHA1" != "$EXPECTED" ]; then echo "SIGNATURE MISMATCH"; exit 1; fi
          echo "SIGNATURE MATCHES PUBLISHED APP"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E 'package:|application-label:' | tee package.txt
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" | tee size.txt
      - name: Upload signed APK artifact (Actions only, never published)
        uses: actions/upload-artifact@v4
        with:
          name: waqt-signed-release-no-ota
          path: app/build/outputs/apk/release/app-release.apk

  signed-artifact-startup:
    if: ${{ !contains(github.event.head_commit.message, '[recovery-test]') }}
    # Diagnosis only: exact artifact delivered to user, never a new release.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: waqt-signed-release-no-ota
          run-id: 44989788115
          github-token: ${{ github.token }}
          path: exact-apk
      - name: Verify exact delivered bytes
        run: |
          echo '17ecc7747d5c15cf27a2f8f703be81be752905249912e027f6b0f1268f3235e3  exact-apk/app-release.apk' | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot test device
        env:
          API: ${{ matrix.api }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
          CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
          test -f "$CFG"
          echo 'hw.ramSize=3072' >> "$CFG"
          echo 'disk.dataPartition.size=4G' >> "$CFG"
          nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
          timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
          for i in $(seq 1 100); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
            sleep 3
          done
          tail -70 /tmp/emulator.log
          exit 1
      - name: Exact release first launch and preserved-data relaunch
        run: |
          mkdir -p startup-evidence
          adb shell input keyevent 82
          adb install exact-apk/app-release.apk | tee startup-evidence/install.txt
          adb logcat -c
          adb shell am start -W -n com.example.glassproductivity/.MainActivity | tee startup-evidence/first-start.txt
          sleep 12
          adb exec-out screencap -p > startup-evidence/first.png
          adb shell uiautomator dump /sdcard/ui.xml || true
          adb pull /sdcard/ui.xml startup-evidence/first.xml || true
          adb logcat -d > startup-evidence/first-logcat.txt
          adb shell dumpsys activity activities > startup-evidence/first-activities.txt
          adb shell pidof com.example.glassproductivity | tee startup-evidence/first-pid.txt || true
          adb shell am force-stop com.example.glassproductivity
          adb install -r exact-apk/app-release.apk | tee startup-evidence/reinstall.txt
          adb logcat -c
          adb shell am start -W -n com.example.glassproductivity/.MainActivity | tee startup-evidence/restart.txt
          sleep 12
          adb exec-out screencap -p > startup-evidence/restart.png
          adb logcat -d > startup-evidence/restart-logcat.txt
          adb shell dumpsys activity activities > startup-evidence/restart-activities.txt
          adb shell pidof com.example.glassproductivity | tee startup-evidence/restart-pid.txt || true
          grep -E -A30 'FATAL EXCEPTION|AndroidRuntime.*(Exception|Error)|Process: com.example.glassproductivity' startup-evidence/*logcat.txt > startup-evidence/crash.txt || true
          if [ -s startup-evidence/crash.txt ]; then cat startup-evidence/crash.txt; exit 1; fi
          test -s startup-evidence/first-pid.txt
          test -s startup-evidence/restart-pid.txt
          grep -qE '(mResumedActivity|topResumedActivity|mFocusedApp|mFocusedWindow).*com.example.glassproductivity' startup-evidence/restart-activities.txt
      - name: Preserve emulator setup logs
        if: always()
        run: |
          mkdir -p startup-evidence
          cp /tmp/emulator.log startup-evidence/emulator.log 2>/dev/null || true
          df -h > startup-evidence/disk.txt
          "$ANDROID_HOME/platform-tools/adb" devices -l > startup-evidence/devices.txt || true
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-signed-startup-api${{ matrix.api }}
          path: startup-evidence/
      - name: Publish test evidence branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ matrix.api }}
        run: |
          mkdir -p /tmp/evidence
          cp startup-evidence/* /tmp/evidence/ 2>/dev/null || true
          cd /tmp/evidence
          git init
          git config user.name 'Waqt CI'
          git config user.email 'waqt-ci@users.noreply.github.com'
          git add .
          git commit -m 'Exact signed artifact startup diagnostic evidence' || true
          git branch -M "startup-evidence-r${{ github.run_id }}-api$API"
          git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force

  recovery-release-check:
    if: ${{ contains(github.event.head_commit.message, '[recovery-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
    - name: Apply diagnostic-only startup guards
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p=Path('app/src/main/java/com/example/glassproductivity/MainActivity.kt')
        s=p.read_text()
        for old,new in [
        ('        super.onCreate(savedInstanceState)\n        audioManager', '        super.onCreate(savedInstanceState)\n        if (StartupRecovery.enterIfRecorded(this)) return\n        audioManager'),
        ('        super.onStart()\n        val filter', '        super.onStart()\n        if (StartupRecovery.isActive(this)) return\n        val filter'),
        ('        super.onResume()\n        syncActiveFocusTimerFromStorage()', '        super.onResume()\n        if (StartupRecovery.isActive(this)) return\n        syncActiveFocusTimerFromStorage()')]:
         assert s.count(old)==1, old
         s=s.replace(old,new)
        p.write_text(s)
        p.with_name('StartupRecovery.kt').write_bytes(__import__('base64').b64decode(''))
        print('Three minimal lifecycle guards applied; helper added. No storage/schema/version changes.')

        PY
        git diff --stat
    - name: Decode existing release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
    - name: Build exact diagnostic signed release
      env:
        WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
        WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
        WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
        WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
      run: gradle :app:assembleRelease --no-daemon --stacktrace
    - name: Verify unchanged package version and signing
      run: |
        mkdir -p recovery-evidence
        APK=app/build/outputs/apk/release/app-release.apk
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee recovery-evidence/certificate.txt
        grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689' recovery-evidence/certificate.txt
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)' | tee recovery-evidence/package.txt
        grep -q "name='com.example.glassproductivity' versionCode='105' versionName='5.6.79'" recovery-evidence/package.txt
        sha256sum "$APK" | tee recovery-evidence/apk-sha256.txt
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot test device
      env:
        API: '36'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_SDK_HOME="$HOME"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
        CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
        test -f "$CFG"
        echo 'hw.ramSize=3072' >> "$CFG"
        echo 'disk.dataPartition.size=4G' >> "$CFG"
        nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Exercise exact release with synthetic saved state
      run: |
        set -e
        mkdir -p recovery-evidence
        APK=app/build/outputs/apk/release/app-release.apk
        adb install "$APK" | tee recovery-evidence/install.txt
        adb shell input keyevent 82
        adb logcat -c
        adb shell am start -W -n com.example.glassproductivity/.MainActivity | tee recovery-evidence/clean-start.txt
        sleep 10
        adb exec-out screencap -p > recovery-evidence/clean.png
        adb logcat -d > recovery-evidence/clean-logcat.txt
        adb shell pidof com.example.glassproductivity > recovery-evidence/clean-pid.txt
        if grep -q 'Process: com.example.glassproductivity' recovery-evidence/clean-logcat.txt; then exit 1; fi
        adb shell am force-stop com.example.glassproductivity
        adb root
        adb wait-for-device
        PKG=com.example.glassproductivity
        DATA=/data/user/0/$PKG
        OWNER=$(adb shell stat -c %u "$DATA" | tr -d '\r')
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as ET
        for with_crash in [True,False]:
         r=ET.Element('map')
         ET.SubElement(r,'string',name='pref_dark_mode').text='synthetic-wrong-type-preserve-me'
         if with_crash:
          ET.SubElement(r,'string',name='last_crash').text='java.lang.IllegalStateException: WAQT_SYNTHETIC_STARTUP_FAILURE'
         Path('/tmp/recovery-with-crash.xml' if with_crash else '/tmp/recovery-no-crash.xml').write_bytes(ET.tostring(r,encoding='utf-8',xml_declaration=True))
        r=ET.Element('map')
        ET.SubElement(r,'string',name='waqt_items_json').text='[{"id":"keep-sentinel","title":"KEEP SYNTHETIC TASK","isHabit":false,"hour":9,"minute":30}]'
        ET.SubElement(r,'string',name='waqt_notes_json').text='[{"id":"keep-note","title":"KEEP SYNTHETIC NOTE"}]'
        Path('/tmp/recovery-business.xml').write_bytes(ET.tostring(r,encoding='utf-8',xml_declaration=True))
        PY
        adb shell mkdir -p "$DATA/shared_prefs"
        adb push /tmp/recovery-with-crash.xml "$DATA/shared_prefs/waqt_prefs.xml"
        adb push /tmp/recovery-business.xml "$DATA/shared_prefs/waqt_productivity_prefs.xml"
        adb shell chown -R "$OWNER:$OWNER" "$DATA/shared_prefs"
        adb shell restorecon -R "$DATA/shared_prefs"
        adb shell sha256sum "$DATA/shared_prefs/waqt_productivity_prefs.xml" > recovery-evidence/business-before.txt
        adb shell sha256sum "$DATA/shared_prefs/waqt_prefs.xml" > recovery-evidence/settings-before.txt
        for pass in first repeat; do
         adb logcat -c
         adb shell am start -W -n "$PKG/.MainActivity" > "recovery-evidence/$pass-start.txt"
         sleep 5
         adb exec-out screencap -p > "recovery-evidence/$pass-recovery.png"
         adb shell uiautomator dump /sdcard/ui.xml
         adb pull /sdcard/ui.xml "recovery-evidence/$pass-recovery.xml"
         grep -q 'WAQT_STARTUP_RECOVERY_TRACE' "recovery-evidence/$pass-recovery.xml"
         grep -q 'WAQT_SYNTHETIC_STARTUP_FAILURE' "recovery-evidence/$pass-recovery.xml"
         adb logcat -d > "recovery-evidence/$pass-logcat.txt"
         if grep -q 'Process: com.example.glassproductivity' "recovery-evidence/$pass-logcat.txt"; then exit 1; fi
         adb shell pidof "$PKG" > "recovery-evidence/$pass-pid.txt"
         adb shell am force-stop "$PKG"
        done
        adb shell sha256sum "$DATA/shared_prefs/waqt_prefs.xml" > recovery-evidence/settings-after.txt
        adb shell sha256sum "$DATA/shared_prefs/waqt_productivity_prefs.xml" > recovery-evidence/business-after.txt
        diff -u recovery-evidence/settings-before.txt recovery-evidence/settings-after.txt
        diff -u recovery-evidence/business-before.txt recovery-evidence/business-after.txt
        # No saved trace: the old startup type failure is recorded by the existing reporter.
        adb push /tmp/recovery-no-crash.xml "$DATA/shared_prefs/waqt_prefs.xml"
        adb shell chown "$OWNER:$OWNER" "$DATA/shared_prefs/waqt_prefs.xml"
        adb shell restorecon "$DATA/shared_prefs/waqt_prefs.xml"
        adb logcat -c
        adb shell am start -W -n "$PKG/.MainActivity" > recovery-evidence/expected-first-failure.txt || true
        sleep 5
        adb logcat -d > recovery-evidence/expected-type-error-logcat.txt
        grep -q 'ClassCastException' recovery-evidence/expected-type-error-logcat.txt
        adb shell am force-stop "$PKG"
        adb shell am start -W -n "$PKG/.MainActivity" > recovery-evidence/recorded-restart.txt
        sleep 5
        adb exec-out screencap -p > recovery-evidence/recorded-recovery.png
        adb shell uiautomator dump /sdcard/ui.xml
        adb pull /sdcard/ui.xml recovery-evidence/recorded-recovery.xml
        grep -q 'WAQT_STARTUP_RECOVERY_TRACE' recovery-evidence/recorded-recovery.xml
        grep -q 'ClassCastException' recovery-evidence/recorded-recovery.xml
        adb shell sha256sum "$DATA/shared_prefs/waqt_productivity_prefs.xml" > recovery-evidence/business-final.txt
        diff -u recovery-evidence/business-before.txt recovery-evidence/business-final.txt
        echo 'RECOVERY_EXISTING_TRACE=yes' > recovery-evidence/verdict.txt
        echo 'RECOVERY_REPEATED_LAUNCH=yes' >> recovery-evidence/verdict.txt
        echo 'RECOVERY_SETTINGS_UNCHANGED=yes' >> recovery-evidence/verdict.txt
        echo 'RECOVERY_BUSINESS_DATA_UNCHANGED=yes' >> recovery-evidence/verdict.txt
        echo 'RECOVERY_NEW_TRACE_ON_NEXT_LAUNCH=yes' >> recovery-evidence/verdict.txt
        cat recovery-evidence/verdict.txt
    - name: Preserve diagnostic APK for review only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-recovery-diagnostic-not-approved-for-install
        path: app/build/outputs/apk/release/app-release.apk
    - name: Preserve recovery evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: waqt-recovery-evidence
        path: recovery-evidence/
    - name: Persist tested source only after checks pass
      run: |
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add app/src/main/java/com/example/glassproductivity/MainActivity.kt app/src/main/java/com/example/glassproductivity/StartupRecovery.kt
        git commit -m 'Add data-preserving early startup diagnostic screen'
        git push origin HEAD:feature/google-drive-backup
    - name: Publish synthetic evidence branch
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/recovery-evidence
        cp recovery-evidence/* /tmp/recovery-evidence/ 2>/dev/null || true
        cp /tmp/emulator.log /tmp/recovery-evidence/emulator.log 2>/dev/null || true
        cd /tmp/recovery-evidence
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Synthetic startup recovery evidence' || true
        git branch -M "recovery-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force
