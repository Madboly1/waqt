# Trigger probe run: rail instrumentation (WAQT_RAIL_TRACE) + per-section settings dumps + focus audio isolation (v14 title-only SAF selection)
name: WAQT Account Screen and Signed Build Check
# Last triggered to verify the side-rail host-interceptor drag fix + focus audio fixes.

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: 'Also run the signed-build-only job'
        required: false
        default: 'true'
  push:
    branches:
      - feature/google-drive-backup
    paths:
      - .github/workflows/account-screen-check.yml

permissions:
  contents: write

jobs:
  account-screens:
    # Opt out of the emulator harness for a given push with [no-screens] in
    # the commit message (e.g. signed-build-only runs).
    if: ${{ !contains(github.event.head_commit.message, '[no-screens]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Install emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Create and boot AVD
        run: |
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n acct -k "system-images;android-31;google_apis;x86_64" --device "pixel_5" --force
          CFG="$ANDROID_AVD_HOME/acct.avd/config.ini"
          if [ ! -f "$CFG" ]; then
            CFG=$(find "$HOME" /usr/local/lib/android -maxdepth 6 -path "*acct.avd/config.ini" 2>/dev/null | head -1)
          fi
          if [ -z "$CFG" ] || [ ! -f "$CFG" ]; then
            echo "acct AVD config.ini not found"; exit 1
          fi
          export ANDROID_AVD_HOME="$(dirname "$(dirname "$CFG")")"
          echo "hw.ramSize=3072" >> "$CFG"
          echo "disk.dataPartition.size=4G" >> "$CFG"
          nohup emulator -avd acct -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then echo "booted after $((i*5))s"; break; fi
            sleep 5
          done
          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "EMULATOR BOOT TIMEOUT"; tail -50 /tmp/emulator.log || true; exit 1
          fi
      - name: Exercise account screens and back behavior
        run: |
          set -x
          mkdir -p shots
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell pm clear com.example.glassproductivity
          adb logcat -c
          adb shell am start -n com.example.glassproductivity/.MainActivity
          sleep 12

          # Tour visual verification on first launch (before dismissal):
          # overlay must be up with its pager; capture two pages as evidence.
          adb shell uiautomator dump /sdcard/uiv.xml >/dev/null 2>&1
          adb pull /sdcard/uiv.xml /tmp/uiv.xml >/dev/null 2>&1 || true
          adb exec-out screencap -p > shots/00_tour_first_page.png
          if grep -q "من 7" /tmp/uiv.xml 2>/dev/null; then echo "TOUR_SHOWN=yes" > /tmp/tour_visual.txt; else echo "TOUR_SHOWN=no" > /tmp/tour_visual.txt; fi
          cat /tmp/tour_visual.txt

          tap_text() {
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1
            adb pull /sdcard/ui.xml ui.xml >/dev/null 2>&1
            python3 - "$1" <<'PY' > /tmp/tap.txt
          import re, sys
          target = sys.argv[1]
          xml = open('ui.xml', encoding='utf-8').read()
          for m in re.finditer(r'<node\b[^>]*>', xml):
              tag = m.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              dm = re.search(r'content-desc="([^"]*)"', tag)
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              cm = re.search(r'clickable="(true|false)"', tag)
              if not bm:
                  continue
              val = (tm.group(1) if tm else '') + ' ' + (dm.group(1) if dm else '')
              if target.lower() in val.lower():
                  x = (int(bm.group(1)) + int(bm.group(3))) // 2
                  y = (int(bm.group(2)) + int(bm.group(4))) // 2
                  score = 10 if (cm and cm.group(1) == 'true') else 0
                  if val.strip() == target:
                      score += 1
                  print(score, x, y)
          PY
          }
          try_tap() {
            tap_text "$1"
            read _SCORE X Y < <(sort -rn /tmp/tap.txt | head -1) || true
            if [ -n "${X:-}" ]; then adb shell input tap $X $Y; unset X Y; return 0; fi
            unset X Y; return 1
          }
          scroll_until() {
            for i in $(seq 1 8); do
              if try_tap "$1"; then return 0; fi
              adb shell input swipe 540 1700 540 700
              sleep 2
            done
            return 1
          }

          # Dismiss first-run tour if present (skip button text is "تخطَّ" in the dump)
          for i in 1 2 3 4; do
            try_tap "تخط" && break
            sleep 2
          done
          sleep 2
          adb shell uiautomator dump /sdcard/uit.xml >/dev/null 2>&1
          adb pull /sdcard/uit.xml /tmp/uit.xml >/dev/null 2>&1 || true
          if grep -q "من 7" /tmp/uit.xml 2>/dev/null; then
            # Coordinate fallback; geometry verified from run 44846731442 dump: skip button bounds [82,2021][201,2072]
            adb shell input tap 141 2046
            sleep 3
            adb shell uiautomator dump /sdcard/uit.xml >/dev/null 2>&1
            adb pull /sdcard/uit.xml /tmp/uit.xml >/dev/null 2>&1 || true
          fi
          adb exec-out screencap -p > shots/01_home.png
          if grep -q "من 7" /tmp/uit.xml 2>/dev/null; then
            echo "TOUR_DISMISSED=no" > shots/results.txt
            cat shots/results.txt
            exit 1
          fi
          echo "TOUR_DISMISSED=yes" > /tmp/tour_state.txt
          cat /tmp/tour_state.txt /tmp/tour_visual.txt
          grep -q '^TOUR_SHOWN=yes$' /tmp/tour_visual.txt

          # Floating-ball drag + tab-swipe interaction probe (runtime evidence for
          # the tab-swipe steal fix: ball drags must not start tab swipes; real
          # content-area swipes must still switch tabs).
          adb shell uiautomator dump /sdcard/uib.xml >/dev/null 2>&1
          adb pull /sdcard/uib.xml /tmp/uib.xml >/dev/null 2>&1 || true
          BALL=$(python3 - <<'PYB'
          import re
          try:
              xml = open('/tmp/uib.xml', encoding='utf-8').read()
          except Exception:
              xml = ''
          for m in re.finditer(r'<node\b[^>]*>', xml):
              tag = m.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              if tm and tm.group(1) == '\u2726' and bm:
                  x = (int(bm.group(1))+int(bm.group(3)))//2
                  y = (int(bm.group(2))+int(bm.group(4)))//2
                  print(f"{x} {y}")
                  break
          PYB
          )
          if [ -z "$BALL" ]; then
            echo "BALL_FOUND=no" | tee shots/swipe_probe.txt
          else
            read BX BY <<< "$BALL"
            echo "BALL_FOUND=yes at $BX,$BY" | tee shots/swipe_probe.txt
            adb logcat -c
            adb shell input swipe $BX $BY $((BX+260)) $((BY+120)) 700
            sleep 2
            adb exec-out screencap -p > shots/10_ball_dragged.png
            adb logcat -d > shots/swipe_probe_ball_logcat.txt
            if grep -q 'ACTIVITY_SWIPE_DOWN eligible=false' shots/swipe_probe_ball_logcat.txt; then echo "BALL_DRAG_EXCLUDED=yes" | tee -a shots/swipe_probe.txt; else echo "BALL_DRAG_EXCLUDED=no" | tee -a shots/swipe_probe.txt; fi
            if grep -q 'SWIPE_CREATED' shots/swipe_probe_ball_logcat.txt; then echo "BALL_DRAG_TAB_SWITCH=yes_BUG" | tee -a shots/swipe_probe.txt; else echo "BALL_DRAG_TAB_SWITCH=no" | tee -a shots/swipe_probe.txt; fi
            adb logcat -c
            adb shell input swipe 250 1780 700 1780 350
            sleep 2
            adb exec-out screencap -p > shots/11_tab_swiped.png
            adb logcat -d > shots/swipe_probe_tab_logcat.txt
            if grep -q 'SWIPE_CREATED' shots/swipe_probe_tab_logcat.txt; then echo "TAB_SWIPE_WORKS=yes" | tee -a shots/swipe_probe.txt; else echo "TAB_SWIPE_WORKS=no" | tee -a shots/swipe_probe.txt; fi
          fi
          cat shots/swipe_probe.txt

          # Side-rail probes (runtime evidence for the rail/tab-swipe fix):
          #  1) a horizontal drag starting on the closed rail must stay with the
          #     rail (no tab switch/intercept) and open it;
          #  2) rail icons must still respond to taps (click regression);
          #  3) the open rail's grip must actually reposition the rail along its
          #     edge;
          #  4) dragging the grip to the opposite edge must re-dock the rail there.
          find_node() {
            adb shell uiautomator dump /sdcard/uif.xml >/dev/null 2>&1
            adb pull /sdcard/uif.xml /tmp/uif.xml >/dev/null 2>&1 || true
            python3 - "$1" "$2" <<'PYF'
          import re, sys
          target = sys.argv[1]
          maxcx = int(sys.argv[2]) if sys.argv[2] else 10**9
          try:
              xml = open('/tmp/uif.xml', encoding='utf-8').read()
          except Exception:
              xml = ''
          for m in re.finditer(r'<node\b[^>]*>', xml):
              tag = m.group(0)
              tm = re.search(r'text="([^"]*)"', tag)
              bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
              if tm and bm and tm.group(1) == target:
                  x1, y1, x2, y2 = (int(bm.group(i)) for i in range(1, 5))
                  cx, cy = (x1 + x2) // 2, (y1 + y2) // 2
                  if cx <= maxcx:
                      print(f"{cx} {cy}")
                      break
          PYF
          }
          RAIL=$(find_node $'\u25b8' 120)
          [ -z "$RAIL" ] && RAIL=$(find_node $'\u25c2' 120)
          if [ -z "$RAIL" ]; then
            echo "RAIL_FOUND=no" | tee -a shots/swipe_probe.txt
          else
            read RX RY <<< "$RAIL"
            echo "RAIL_FOUND=yes at $RX,$RY" | tee -a shots/swipe_probe.txt
            adb logcat -c
            adb shell input swipe $RX $RY $((RX+260)) $RY 120
            sleep 2
            adb exec-out screencap -p > shots/30_rail_dragged.png
            adb logcat -d > shots/swipe_probe_rail_logcat.txt
            if grep -q 'SWIPE_CREATED' shots/swipe_probe_rail_logcat.txt; then echo "RAIL_DRAG_TAB_SWITCH=yes_BUG" | tee -a shots/swipe_probe.txt; else echo "RAIL_DRAG_TAB_SWITCH=no" | tee -a shots/swipe_probe.txt; fi
            if grep -q 'ACTIVITY_SWIPE_INTERCEPT' shots/swipe_probe_rail_logcat.txt; then echo "RAIL_DRAG_INTERCEPTED=yes_BUG" | tee -a shots/swipe_probe.txt; else echo "RAIL_DRAG_INTERCEPTED=no" | tee -a shots/swipe_probe.txt; fi

            GRIP=$(find_node $'\u2261' 400)
            if [ -z "$GRIP" ]; then echo "RAIL_OPENED=no" | tee -a shots/swipe_probe.txt; else echo "RAIL_OPENED=yes at $GRIP" | tee -a shots/swipe_probe.txt; fi
            if [ -z "$GRIP" ]; then
              adb shell input tap $RX $RY
              sleep 2
              adb exec-out screencap -p > shots/31_rail_tapped.png
              GRIP2=$(find_node $'\u2261' 400)
              if [ -n "$GRIP2" ]; then echo "RAIL_TAP_OPEN=yes" | tee -a shots/swipe_probe.txt; GRIP=$GRIP2; else echo "RAIL_TAP_OPEN=no" | tee -a shots/swipe_probe.txt; fi
            fi

            ICON=$(find_node $'\U0001F4CA' 400)
            [ -z "$ICON" ] && ICON=$(find_node '&#128202;' 400)
            if [ -z "$ICON" ]; then
              echo "RAIL_CLICK_WORKS=no_icon" | tee -a shots/swipe_probe.txt
            else
              read IX IY <<< "$ICON"
              adb shell input tap $IX $IY
              sleep 2
              adb shell uiautomator dump /sdcard/uid.xml >/dev/null 2>&1
              adb pull /sdcard/uid.xml /tmp/uid.xml >/dev/null 2>&1 || true
              if grep -q 'أسبوع' /tmp/uid.xml && grep -q 'مخصص' /tmp/uid.xml; then echo "RAIL_CLICK_WORKS=yes" | tee -a shots/swipe_probe.txt; else echo "RAIL_CLICK_WORKS=no" | tee -a shots/swipe_probe.txt; fi
              adb shell input keyevent 4
              sleep 2
            fi

            GRIP_BEFORE=$(find_node $'\u2261' 400)
            if [ -n "$GRIP_BEFORE" ]; then
              read GX1 GY1 <<< "$GRIP_BEFORE"
              adb logcat -c
              adb shell input swipe $GX1 $GY1 $GX1 $((GY1+300)) 700
              sleep 2
              GRIP_AFTER=$(find_node $'\u2261' 400)
              adb logcat -d > shots/swipe_probe_rail_vertical_logcat.txt
              read GX2 GY2 <<< "${GRIP_AFTER:-$GX1 $GY1}"
              DYV=$((GY2 - GY1))
              echo "RAIL_VERTICAL_DELTA=$DYV" | tee -a shots/swipe_probe.txt
              if [ "$DYV" -ge 100 ]; then echo "RAIL_REPOSITIONED_VERTICAL=yes" | tee -a shots/swipe_probe.txt; else echo "RAIL_REPOSITIONED_VERTICAL=no" | tee -a shots/swipe_probe.txt; fi
              if grep -q 'SWIPE_CREATED' shots/swipe_probe_rail_vertical_logcat.txt; then echo "RAIL_VERTICAL_TAB_SWITCH=yes_BUG" | tee -a shots/swipe_probe.txt; else echo "RAIL_VERTICAL_TAB_SWITCH=no" | tee -a shots/swipe_probe.txt; fi
            else
              echo "RAIL_REPOSITIONED_VERTICAL=no_grip" | tee -a shots/swipe_probe.txt
              echo "RAIL_VERTICAL_TAB_SWITCH=no_grip" | tee -a shots/swipe_probe.txt
            fi

            GRIP2=$(find_node $'\u2261' 10000)
            if [ -n "$GRIP2" ]; then
              read HX HY <<< "$GRIP2"
              adb logcat -c
              adb shell input swipe $HX $HY 1030 $HY 900
              sleep 2
              adb logcat -d > shots/swipe_probe_rail_edge_logcat.txt
              EDGE_PREF=$(adb shell "run-as com.example.glassproductivity sh -c 'cat shared_prefs/waqt_prefs.xml 2>/dev/null'" | grep -o 'name="rail_edge" value="[0-9]*"' | grep -o '[0-9]*$' || true)
              echo "RAIL_EDGE_PREF=${EDGE_PREF:-unknown}" | tee -a shots/swipe_probe.txt
              GRIPX=$(find_node $'\u2261' 10000); GX=0; [ -n "$GRIPX" ] && read GX GYY <<< "$GRIPX"; [ "${GX:-0}" -gt 540 ] && EDGE_PREF=1
              if [ "$EDGE_PREF" = "1" ]; then echo "RAIL_MOVED_TO_RIGHT_EDGE=yes" | tee -a shots/swipe_probe.txt; else echo "RAIL_MOVED_TO_RIGHT_EDGE=no" | tee -a shots/swipe_probe.txt; fi
              if grep -q 'SWIPE_CREATED' shots/swipe_probe_rail_edge_logcat.txt; then echo "RAIL_EDGE_TAB_SWITCH=yes_BUG" | tee -a shots/swipe_probe.txt; else echo "RAIL_EDGE_TAB_SWITCH=no" | tee -a shots/swipe_probe.txt; fi
              adb exec-out screencap -p > shots/31_rail_right_edge.png
            else
              echo "RAIL_MOVED_TO_RIGHT_EDGE=no_grip" | tee -a shots/swipe_probe.txt
              echo "RAIL_EDGE_TAB_SWITCH=no_grip" | tee -a shots/swipe_probe.txt
            fi
          fi
          cat shots/swipe_probe.txt
          # ---- Settings organization evidence (non-gated): reopen settings, expand each
          # section, screenshot it, then verify moved-item placement from one full dump.
          try_tap "⚙" || adb shell input tap 111 252 || true
          sleep 4
          adb exec-out screencap -p > shots/40_settings_top.png
          for title in "إعدادات المساعد الذكي" "التركيز والاستراحة" "التنبيهات والصوت" "بياناتك والنسخ الاحتياطي" "صلاحيات التطبيق" "عن وَقْت والتحديث السحابي"; do
            if scroll_until "$title"; then
              sleep 2
              safe=$(echo "$title" | md5sum | cut -c1-6)
              adb exec-out screencap -p > shots/4x_settings_$safe.png
              adb shell uiautomator dump /sdcard/uix_$safe.xml >/dev/null 2>&1
              adb pull /sdcard/uix_$safe.xml shots/dump_$safe.xml >/dev/null 2>&1 || true
              echo "SETTINGS_EXPANDED=$title" >> shots/settings_probe.txt
            else
              echo "SETTINGS_SECTION_MISSING=$title" >> shots/settings_probe.txt
            fi
          done
          adb shell input swipe 540 1500 540 500 400
          sleep 2
          adb exec-out screencap -p > shots/49_settings_about_scrolled.png
          adb shell uiautomator dump /sdcard/uix_zzabout2.xml >/dev/null 2>&1
          adb pull /sdcard/uix_zzabout2.xml shots/dump_zzabout2.xml >/dev/null 2>&1 || true
          python3 - <<'PYS' >> shots/settings_probe.txt
          import re, glob
          def texts_of(path):
              try:
                  xml = open(path, encoding='utf-8').read()
              except Exception:
                  return []
              return re.findall(r'text="([^"]*)"', xml)
          dumps = sorted(glob.glob('shots/dump_*.xml'))
          def idx(texts, sub):
              for i, t in enumerate(texts):
                  if sub in t:
                      return i
              return -1
          def yn(c): return 'yes' if c else 'no'
          checks = {k: False for k in ['AUDIO_IN_FOCUS','PERMS_PLACED','TOUR_IN_ABOUT','CONTACT_IN_ABOUT']}
          for d in dumps:
              texts = texts_of(d)
              focus = idx(texts, 'التركيز والاستراحة'); alarms = idx(texts, 'التنبيهات والصوت')
              audio = idx(texts, 'اختيار صوت أو موسيقى من الجهاز')
              perms = idx(texts, 'صلاحيات التطبيق'); permsbtn = idx(texts, 'أذونات التنبيهات والخلفية')
              about = idx(texts, 'عن وَقْت والتحديث السحابي'); tour = idx(texts, 'شرح التطبيق'); contact = idx(texts, 'تواصل معنا')
              if focus >= 0 and audio > focus and (alarms < 0 or audio < alarms): checks['AUDIO_IN_FOCUS'] = True
              if perms >= 0 and permsbtn > perms and (about < 0 or permsbtn < about): checks['PERMS_PLACED'] = True
              if about >= 0 and tour > about: checks['TOUR_IN_ABOUT'] = True
              if about >= 0 and contact > about: checks['CONTACT_IN_ABOUT'] = True
          for k, v in checks.items():
              print('SETTINGS_' + k + '=' + yn(v))
          print('SETTINGS_DUMPS=' + str(len(dumps)))
          PYS
          cat shots/settings_probe.txt 2>/dev/null || true
          adb shell input keyevent 4; sleep 2
                    # Acceptance assertions: the job must FAIL when the swipe-fix checks
          # could not be verified - evidence alone is not a pass.
          grep -q '^BALL_FOUND=yes' shots/swipe_probe.txt
          grep -q '^BALL_DRAG_EXCLUDED=yes$' shots/swipe_probe.txt
          grep -q '^BALL_DRAG_TAB_SWITCH=no$' shots/swipe_probe.txt
          grep -q '^TAB_SWIPE_WORKS=yes$' shots/swipe_probe.txt
          grep -q '^RAIL_FOUND=yes' shots/swipe_probe.txt
          grep -q '^RAIL_DRAG_TAB_SWITCH=no$' shots/swipe_probe.txt
          grep -q '^RAIL_DRAG_INTERCEPTED=no$' shots/swipe_probe.txt
          grep -q '^RAIL_OPENED=yes' shots/swipe_probe.txt
          grep -q '^RAIL_CLICK_WORKS=yes$' shots/swipe_probe.txt
          grep -q '^RAIL_REPOSITIONED_VERTICAL=yes$' shots/swipe_probe.txt
          grep -q '^RAIL_VERTICAL_TAB_SWITCH=no$' shots/swipe_probe.txt
          grep -q '^RAIL_MOVED_TO_RIGHT_EDGE=yes$' shots/swipe_probe.txt
          grep -q '^RAIL_EDGE_TAB_SWITCH=no$' shots/swipe_probe.txt

          # Reminder-scheduling runtime signal (evidence only): capture pending
          # alarms for the app after boot so the scheduled trigger times can be
          # cross-checked against due dates outside the unit tests.
          adb shell dumpsys alarm > shots/alarm_dump.txt || true
          grep -n 'com.example.glassproductivity' shots/alarm_dump.txt > shots/alarm_hits.txt || true

          # Record pre-test persisted state (debug build allows run-as)
          adb shell "run-as com.example.glassproductivity sh -c 'ls -la shared_prefs'" > shots/prefs_before.txt 2>/dev/null || true
          adb shell "run-as com.example.glassproductivity sh -c 'cat shared_prefs/*.xml 2>/dev/null'" | md5sum > shots/prefs_before.md5 || true

          # Open settings via gear button (home body is one custom view; gear at image (75,170) -> device (111,252))
          try_tap "⚙" || adb shell input tap 111 252 || true
          sleep 4
          adb exec-out screencap -p > shots/02_settings_top.png

          # Account accordion section
          if ! scroll_until "حساب جوجل والنسخ السحابي"; then
            adb shell uiautomator dump /sdcard/uinav.xml >/dev/null 2>&1
            adb pull /sdcard/uinav.xml shots/ui_nav_blocker.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > shots/03_account_section.png
            { cat /tmp/tour_state.txt; echo "NAV_BLOCKER=account_section"; } > shots/results.txt
            cat shots/results.txt
            exit 1
          fi
          sleep 3
          adb exec-out screencap -p > shots/03_account_section.png

          # Tap sign-in: expect system Credential Manager / add-account UI, no account configured
          if ! try_tap "تسجيل الدخول بحساب جوجل"; then
            adb shell uiautomator dump /sdcard/uinav.xml >/dev/null 2>&1
            adb pull /sdcard/uinav.xml shots/ui_nav_blocker.xml >/dev/null 2>&1 || true
            adb exec-out screencap -p > shots/04_signin_prompt.png
            { cat /tmp/tour_state.txt; echo "NAV_BLOCKER=signin_button"; } > shots/results.txt
            cat shots/results.txt
            exit 1
          fi
          sleep 8
          adb exec-out screencap -p > shots/04_signin_prompt.png
          adb shell uiautomator dump /sdcard/ui2.xml >/dev/null 2>&1
          adb pull /sdcard/ui2.xml shots/ui_at_signin.xml >/dev/null 2>&1 || true
          adb shell input keyevent 4
          sleep 2

          # Data & backup accordion section
