              val = (tm.group(1) if tm else '') + ' ' + (dm.group(1) if dm else '')
              if target.lower() in val.lower():
                  x = (int(bm.group(1)) + int(bm.group(3))) // 2
                  y = (int(bm.group(2)) + int(bm.group(4))) // 2
