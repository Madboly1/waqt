          if grep 'WAQT_AUDIO_TRACE.*PLAY_CUSTOM' shots/audio_probe_logcat.txt | grep -q 'waqt_probe_beta'; then echo "AUDIO_OTHER_FILE_PLAYED=yes" >> shots/audio_probe.txt; else echo "AUDIO_OTHER_FILE_PLAYED=no" >> shots/audio_probe.txt; fi
          DISTINCT=$(grep 'WAQT_AUDIO_TRACE.*PLAY_CUSTOM' shots/audio_probe_logcat.txt | grep -o 'name=[^ ]*' | sort -u | wc -l)
          echo "AUDIO_PLAY_DISTINCT=$DISTINCT" >> shots/audio_probe.txt
          if grep -q '^AUDIO_PICKED_COUNT=1$' shots/audio_probe.txt && grep -q '^AUDIO_PICKED_ALPHA=yes$' shots/audio_probe.txt && grep -q '^AUDIO_PLAY_CUSTOM=waqt_probe_alpha.wav$' shots/audio_probe.txt && [ "$DISTINCT" = "1" ] && grep -q '^AUDIO_OTHER_FILE_PLAYED=no$' shots/audio_probe.txt; then echo "AUDIO_ISOLATION=pass" >> shots/audio_probe.txt; else echo "AUDIO_ISOLATION=fail" >> shots/audio_probe.txt; fi
          cat shots/audio_probe.txt
