name: Build WAQT APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP (Any Name)
        run: |
          echo "=== Finding any ZIP archive ==="
          ls -la
          for f in *.zip; do
            if [ -f "$f" ]; then
              echo "Extracting: $f ..."
              unzip -o "$f"
            fi
          done
          if [ ! -f "build.gradle.kts" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "build.gradle.kts" -not -path "./build.gradle.kts" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              DIRNAME=$(dirname "$SUBDIR")
              echo "Moving files from subfolder $DIRNAME to root..."
              cp -r "$DIRNAME"/* .
            fi
          fi
          echo "=== Extracted Files ==="
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload WAQT APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAQT-App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
