name: Build WAQT APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract ZIP if Uploaded Directly
        run: |
          if [ -f "WAQT_Complete_GitHub_Project.zip" ]; then
            unzip -o WAQT_Complete_GitHub_Project.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload WAQT APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAQT-App-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
