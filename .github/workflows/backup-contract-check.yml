name: Waqt backup type contract and exact signed upgrade
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/backup-contract-check.yml
permissions:
  contents: write
jobs:
  exact-signed-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: waqt-signed-release-no-ota
        run-id: 44989788115
        github-token: ${{ github.token }}
        path: original-apk
    - uses: actions/download-artifact@v4
      with:
        name: waqt-recovery-diagnostic-not-approved-for-install
        run-id: 45005635166
        github-token: ${{ github.token }}
        path: diagnostic-apk
    - name: Verify both exact APK bytes
      run: |
        echo '17ecc7747d5c15cf27a2f8f703be81be752905249912e027f6b0f1268f3235e3  original-apk/app-release.apk' | sha256sum -c -
        echo '4ad40e53a2f93314ee01bab677ecf39ac37cc7a181af3e92858bacab0f44e40a  diagnostic-apk/app-release.apk' | sha256sum -c -
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot test device
      env:
        API: '36'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_SDK_HOME="$HOME"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
        CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
        test -f "$CFG"
        echo 'hw.ramSize=3072' >> "$CFG"
        echo 'disk.dataPartition.size=4G' >> "$CFG"
        nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Verify populated original to diagnostic upgrade
      run: |
        set -e
        mkdir -p upgrade-evidence
        PKG=com.example.glassproductivity
        DATA=/data/user/0/$PKG
        adb shell input keyevent 82
        adb install original-apk/app-release.apk | tee upgrade-evidence/original-install.txt
        adb shell am start -W -n "$PKG/.MainActivity" > upgrade-evidence/original-clean-launch.txt
        sleep 7
        adb shell am force-stop "$PKG"
        adb root
        adb wait-for-device
        OWNER=$(adb shell stat -c %u "$DATA" | tr -d '\r')
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as E
        r=E.Element('map')
        E.SubElement(r,'boolean',name='pref_dark_mode',value='false')
        E.SubElement(r,'float',name='rail_offset',value='0.8')
        E.SubElement(r,'int',name='rail_edge',value='1')
        Path('/tmp/upgrade-settings.xml').write_bytes(E.tostring(r,encoding='utf-8',xml_declaration=True))
        r=E.Element('map')
        E.SubElement(r,'string',name='waqt_items_json').text='[{"id":"keep-task","title":"KEEP UPGRADE TASK","hour":9,"minute":30,"isHabit":false}]'
        E.SubElement(r,'string',name='waqt_notes_json').text='[{"id":"keep-note","title":"KEEP UPGRADE NOTE"}]'
        E.SubElement(r,'int',name='active_focus_total_ms',value='1500000')
        Path('/tmp/upgrade-productivity.xml').write_bytes(E.tostring(r,encoding='utf-8',xml_declaration=True))
        PY
        adb push /tmp/upgrade-settings.xml "$DATA/shared_prefs/waqt_prefs.xml"
        adb push /tmp/upgrade-productivity.xml "$DATA/shared_prefs/waqt_productivity_prefs.xml"
        adb shell mkdir -p "$DATA/files/journal_audio"
        adb shell "echo UPGRADE_MEDIA_KEEP > $DATA/files/journal_audio/keep-sentinel.wav"
        adb shell chown -R "$OWNER:$OWNER" "$DATA/shared_prefs" "$DATA/files"
        adb shell restorecon -R "$DATA/shared_prefs" "$DATA/files"
        adb logcat -c
        adb shell am start -W -n "$PKG/.MainActivity" > upgrade-evidence/original-populated-launch.txt || true
        sleep 5
        adb logcat -d > upgrade-evidence/original-logcat.txt
        grep -q 'ClassCastException' upgrade-evidence/original-logcat.txt
        adb shell am force-stop "$PKG"
        adb shell cat "$DATA/shared_prefs/waqt_prefs.xml" > upgrade-evidence/original-settings.xml
        grep -q 'last_crash' upgrade-evidence/original-settings.xml
        grep -q 'ClassCastException' upgrade-evidence/original-settings.xml
        adb shell "find $DATA/shared_prefs $DATA/files -type f -exec sha256sum {} \; | sort" > upgrade-evidence/before-hashes.txt
        adb exec-out cat "$DATA/files/profileInstalled" > upgrade-evidence/profile-cache-before.bin
        adb install -r diagnostic-apk/app-release.apk | tee upgrade-evidence/upgrade-install.txt
        adb logcat -c
        adb shell am start -W -n "$PKG/.MainActivity" > upgrade-evidence/recovery-launch.txt
        sleep 6
        adb shell pidof "$PKG" > upgrade-evidence/recovery-pid.txt
        adb logcat -d > upgrade-evidence/recovery-logcat.txt
        if grep -q 'Process: com.example.glassproductivity' upgrade-evidence/recovery-logcat.txt; then exit 1; fi
        adb exec-out screencap -p > upgrade-evidence/recovery-after-upgrade.png
        adb shell uiautomator dump /sdcard/upgrade.xml
        adb pull /sdcard/upgrade.xml upgrade-evidence/recovery-after-upgrade.xml
        grep -q 'WAQT_STARTUP_RECOVERY_TRACE' upgrade-evidence/recovery-after-upgrade.xml
        grep -q 'ClassCastException' upgrade-evidence/recovery-after-upgrade.xml
        adb shell "find $DATA/shared_prefs $DATA/files -type f -exec sha256sum {} \; | sort" > upgrade-evidence/after-hashes.txt
        adb exec-out cat "$DATA/files/profileInstalled" > upgrade-evidence/profile-cache-after.bin
        python3 - <<'PYCACHE'
        from pathlib import Path
        import struct
        p=Path('upgrade-evidence')
        before=struct.unpack('>iiqq',(p/'profile-cache-before.bin').read_bytes())
        after=struct.unpack('>iiqq',(p/'profile-cache-after.bin').read_bytes())
        assert before[0]==after[0]==1,(before,after)
        assert after[2]>before[2],(before,after)
        print('PROFILE_VERIFIER_INSTALL_CACHE_UPDATED',before,after)
        for phase in ['before','after']:
         lines=(p/(phase+'-hashes.txt')).read_text().splitlines()
         # The sole excluded file is AndroidX ProfileVerifier compilation cache.
         business=[x for x in lines if not x.endswith('/files/profileInstalled')]
         (p/(phase+'-business-hashes.txt')).write_text('\n'.join(business)+'\n')
        PYCACHE
        diff -u upgrade-evidence/before-business-hashes.txt upgrade-evidence/after-business-hashes.txt
        printf '%s\n' ORIGINAL_POPULATED_FAILURE_RECORDED=yes EXACT_SIGNED_IN_PLACE_UPGRADE=yes RECOVERY_TRACE_EXPOSED=yes ALL_TEST_PREFS_AND_BUSINESS_FILES_UNCHANGED=yes PROFILE_VERIFIER_CACHE_CHANGE_VALIDATED=yes > upgrade-evidence/verdict.txt
        cat upgrade-evidence/verdict.txt
    - name: Preserve exact upgrade evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: exact-signed-upgrade-evidence
        path: upgrade-evidence/
    - name: Publish disposable upgrade evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/upgrade-publish
        cp upgrade-evidence/* /tmp/upgrade-publish/ 2>/dev/null || true
        cd /tmp/upgrade-publish
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable exact signed upgrade evidence' || true
        git branch -M "upgrade-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force
  backup-type-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
    - name: Prepare preference type fix and regression cases
      run: |
        python3 - <<'PY'
        import pathlib,base64,hashlib
        p=pathlib.Path("app/src/main/java/com/example/glassproductivity/WaqtCloudBackup.kt")
        assert hashlib.sha256(p.read_bytes()).hexdigest()=="adc400537d733942ddbf65019177590bc514a4be2f1df3bc006dfb1fdad8c5fc"
        p=pathlib.Path('app/src/main/java/com/example/glassproductivity/WaqtCloudBackup.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
        p=pathlib.Path('app/src/main/java/com/example/glassproductivity/BackupPreferenceTypes.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
        p=pathlib.Path('app/src/test/java/com/example/glassproductivity/BackupPreferenceTypesTest.kt');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''))
        PY
        git diff --stat
    - name: Test type contracts and existing backup safety integration wiring
      run: |-
        set -o pipefail
        gradle :app:testDebugUnitTest --tests 'com.example.glassproductivity.Backup*' --tests 'com.example.glassproductivity.WaqtCloudBackupTest' --no-daemon --stacktrace | tee /tmp/backup-contract-build-log.txt
    - name: Keep regression test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backup-type-contract-test-results
        path: app/build/test-results/testDebugUnitTest/
    - name: Publish disposable type contract evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/types-publish
        cp app/build/test-results/testDebugUnitTest/*.xml /tmp/types-publish/ 2>/dev/null || true
        cp /tmp/backup-contract-build-log.txt /tmp/types-publish/build-log.txt 2>/dev/null || true
        cd /tmp/types-publish
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable backup type contract evidence' || true
        git branch -M "type-contract-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force
    - name: Persist backup fix only after tests pass
      run: |
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add app/src/main/java/com/example/glassproductivity/WaqtCloudBackup.kt app/src/main/java/com/example/glassproductivity/BackupPreferenceTypes.kt app/src/test/java/com/example/glassproductivity/BackupPreferenceTypesTest.kt
        git commit -m 'Preserve preference types in backups and support legacy numeric contracts'
        git push origin HEAD:feature/google-drive-backup
