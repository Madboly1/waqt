name: Waqt approved settings and safe updater build
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/settings-updater-build.yml
permissions:
  contents: write
jobs:
  settings-update-signed-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e46dedf819910b804d8c8fa6f3fed38c937ee2a8
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
    - name: Apply approved settings and updater candidate without publishing
      run: |
        python3 - <<'PYSOURCE'
        import base64,pathlib,subprocess,json
        patch=''
        pathlib.Path('/tmp/settings.patch').write_bytes(base64.b64decode(patch))
        subprocess.run(['git','apply','/tmp/settings.patch'],check=True)
        files={'app/src/main/java/com/example/glassproductivity/WaqtUpdateManifest.kt': '', 'app/src/main/java/com/example/glassproductivity/WaqtUpdateClient.kt': '', 'app/src/test/java/com/example/glassproductivity/WaqtUpdateSafetyTest.kt': ''}
        for name,data in files.items():
         p=pathlib.Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(data))
        PYSOURCE
    - name: Decode existing release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.WAQT_KEYSTORE_BASE64 }}
      run: |
        test -n "$KEYSTORE_BASE64"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waqt-release.jks"
    - name: Run all backup numeric and updater regressions and build exact signed candidate
      env:
        WAQT_KEYSTORE_PATH: ${{ runner.temp }}/waqt-release.jks
        WAQT_KEYSTORE_PASSWORD: ${{ secrets.WAQT_KEYSTORE_PASSWORD }}
        WAQT_KEY_ALIAS: ${{ secrets.WAQT_KEY_ALIAS }}
        WAQT_KEY_PASSWORD: ${{ secrets.WAQT_KEY_PASSWORD }}
      run: |
        mkdir -p settings-evidence
        set +e
        gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee settings-evidence/build.log
        RESULT=${PIPESTATUS[0]}
        set -e
        if [ "$RESULT" -ne 0 ]; then exit "$RESULT"; fi
        python3 - <<'PYTEST'
        from pathlib import Path
        import xml.etree.ElementTree as E,json
        files=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
        results=[E.parse(p).getroot() for p in files]
        rows=[{k:r.get(k) for k in ['name','tests','failures','errors','skipped']} for r in results]
        new=[r for r in rows if r['name'].endswith('WaqtUpdateSafetyTest')]
        assert new and int(new[0]['tests'])>=27,new
        assert all(int(r['failures'])==0 and int(r['errors'])==0 and int(r['skipped'])==0 for r in rows),rows
        Path('settings-evidence').mkdir(exist_ok=True)
        Path('settings-evidence/unit-verdict.json').write_text(json.dumps(rows,indent=2))
        print('ALL_UNIT_REGRESSIONS_PASS',sum(int(r['tests']) for r in rows))
        PYTEST
    - name: Verify unchanged package version and signing
      run: |
        mkdir -p settings-evidence
        APK=app/build/outputs/apk/release/app-release.apk
        BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
        "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" | tee settings-evidence/certificate.txt
        grep -q '76b52b825b663a53294a8030a7ca52ef74a2cddabc197ff7f9606045e60c9689' settings-evidence/certificate.txt
        "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|application-label:)' | tee settings-evidence/package.txt
        grep -q "name='com.example.glassproductivity' versionCode='105' versionName='5.6.79'" settings-evidence/package.txt
        sha256sum "$APK" | tee settings-evidence/apk-sha256.txt
    - name: Preserve exact reviewed source hashes
      run: |
        mkdir -p settings-source
        cp /tmp/settings.patch settings-source/
        cp app/src/main/java/com/example/glassproductivity/{MainActivity,WaqtUpdateManifest,WaqtUpdateClient,WaqtCloudBackup,BackupPreferenceTypes,StartupRecovery,SavedNumericPreferences,AlarmScheduler}.kt settings-source/
        cp app/src/test/java/com/example/glassproductivity/WaqtUpdateSafetyTest.kt settings-source/
        cp app/src/main/AndroidManifest.xml settings-source/
        cp app/src/main/res/xml/file_paths.xml settings-source/
        sha256sum settings-source/* > settings-evidence/source-sha256.txt
    - name: Keep candidate and reviewed source for private runtime verification
      uses: actions/upload-artifact@v4
      with:
        name: waqt-settings-updater-candidate-not-yet-install-approved
        path: |-
          app/build/outputs/apk/release/app-release.apk
          settings-source/
          settings-evidence/
          app/build/test-results/testDebugUnitTest/
    - name: Publish disposable unit and metadata evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/settings-evidence
        cp -R settings-evidence/. /tmp/settings-evidence/
        if [ -d app/build/test-results/testDebugUnitTest ]; then cp -R app/build/test-results/testDebugUnitTest /tmp/settings-evidence/unit-results; fi
        cd /tmp/settings-evidence
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable settings and update safety build evidence' || true
        git branch -M "settings-build-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force
