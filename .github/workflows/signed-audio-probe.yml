name: Waqt exact signed local audio isolation
'on':
  push:
    branches:
    - feature/google-drive-backup
    paths:
    - .github/workflows/signed-audio-probe.yml
permissions:
  contents: write
jobs:
  signed-local-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: waqt-focus-type-repair-exact-retested
        run-id: 45009661515
        github-token: ${{ github.token }}
        path: exact-apk
    - name: Verify exact existing signed startup repair bytes
      run: echo 'f40437cae4185714970647907b6447d0abf7c89c3f254a032151a5acc3e35fa4  exact-apk/app-release.apk' | sha256sum -c -
    - name: Enable emulator acceleration
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Boot test device
      env:
        API: '36'
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        if [ ! -x "$ANDROID_HOME/platform-tools/adb" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator'
        fi
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-$API;google_apis;x86_64"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
        export ANDROID_SDK_HOME="$HOME"
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"
        echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n startup -k "system-images;android-$API;google_apis;x86_64" --device pixel_5 --force
        CFG="$ANDROID_AVD_HOME/startup.avd/config.ini"
        test -f "$CFG"
        echo 'hw.ramSize=3072' >> "$CFG"
        echo 'disk.dataPartition.size=4G' >> "$CFG"
        nohup "$ANDROID_HOME/emulator/emulator" -avd startup -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -memory 3072 > /tmp/emulator.log 2>&1 &
        timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device || { cat /tmp/emulator.log; exit 1; }
        for i in $(seq 1 100); do
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi
          sleep 3
        done
        tail -70 /tmp/emulator.log
        exit 1
    - name: Prepare clean disposable signed installation
      run: |
        mkdir -p shots
        adb shell wm size 1080x2340
        adb shell wm density 420
        adb install exact-apk/app-release.apk | tee shots/exact-install.txt
        adb root
        adb wait-for-device
        PKG=com.example.glassproductivity
        DATA=/data/user/0/$PKG
        OWNER=$(adb shell stat -c %u "$DATA" | tr -d '\r')
        python3 - <<'PYSEED'
        import xml.etree.ElementTree as E
        from pathlib import Path
        r=E.Element('map')
        for k,v in [('onboarding_done','true'),('is_arabic','true'),('ota_auto_check','false'),('pref_auto_float','false')]:
         E.SubElement(r,'boolean',name=k,value=v)
        Path('/tmp/audio-clean-settings.xml').write_bytes(E.tostring(r,encoding='utf-8',xml_declaration=True))
        PYSEED
        adb shell mkdir -p "$DATA/shared_prefs"
        adb push /tmp/audio-clean-settings.xml "$DATA/shared_prefs/waqt_prefs.xml"
        adb shell chown -R "$OWNER:$OWNER" "$DATA/shared_prefs"
        adb shell restorecon -R "$DATA/shared_prefs"
        adb shell pm grant "$PKG" android.permission.POST_NOTIFICATIONS || true
        adb shell input keyevent 82
    - name: Select one local song through actual picker and collect playback evidence
      run: |
        mkdir -p shots
        python3 - <<'PYWAV'
        import wave, math, struct
        for name, freq, secs in (("waqt_probe_alpha.wav", 440, 4), ("waqt_probe_beta.wav", 880, 7)):
            w = wave.open("/tmp/" + name, "w")
            w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000)
            frames = b"".join(struct.pack("<h", int(9000 * math.sin(2 * math.pi * freq * i / 8000))) for i in range(8000 * secs))
            w.writeframes(frames); w.close()
        PYWAV
        adb push /tmp/waqt_probe_alpha.wav /sdcard/Download/waqt_probe_alpha.wav
        adb push /tmp/waqt_probe_beta.wav /sdcard/Download/waqt_probe_beta.wav
        tap_text() {
          adb shell uiautomator dump /sdcard/ui.xml >> shots/probe-commands.log 2>&1
          adb pull /sdcard/ui.xml ui.xml >> shots/probe-commands.log 2>&1
          python3 - "$1" <<'PY' > /tmp/tap.txt
        import re, sys
        target = sys.argv[1]
        xml = open('ui.xml', encoding='utf-8').read()
        for m in re.finditer(r'<node\b[^>]*>', xml):
            tag = m.group(0)
            tm = re.search(r'text="([^"]*)"', tag)
            dm = re.search(r'content-desc="([^"]*)"', tag)
            bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
            cm = re.search(r'clickable="(true|false)"', tag)
            if not bm:
                continue
            if int(bm.group(3)) <= int(bm.group(1)) or int(bm.group(4)) <= int(bm.group(2)):
                continue
            val = (tm.group(1) if tm else '') + ' ' + (dm.group(1) if dm else '')
            if target.lower() in val.lower():
                x = (int(bm.group(1)) + int(bm.group(3))) // 2
                y = (int(bm.group(2)) + int(bm.group(4))) // 2
                score = 10 if (cm and cm.group(1) == 'true') else 0
                if val.strip() == target:
                    score += 1
                print(score, x, y)
        PY
        }
        try_tap() {
          tap_text "$1"
          read _SCORE X Y < <(sort -rn /tmp/tap.txt | head -1) || true
          if [ -n "${X:-}" ]; then adb shell input tap $X $Y; unset X Y; return 0; fi
          unset X Y; return 1
        }
        scroll_until() {
          for i in $(seq 1 8); do
            if try_tap "$1"; then return 0; fi
            adb shell input swipe 540 1700 540 700
            sleep 2
          done
          return 1
        }
        adb shell am force-stop com.example.glassproductivity
        sleep 2
        adb shell am start -n com.example.glassproductivity/.MainActivity
        sleep 8
        adb logcat -c
        for i in 1 2 3; do
          if ! try_tap "التركيز"; then adb shell input tap 423 2078; fi
          sleep 3
          adb shell uiautomator dump /sdcard/uif.xml >> shots/probe-commands.log 2>&1
          adb pull /sdcard/uif.xml /tmp/uif.xml >> shots/probe-commands.log 2>&1 || true
          if grep -q 'بومودورو' /tmp/uif.xml; then break; fi
        done
        if ! grep -q 'بومودورو' /tmp/uif.xml; then
          echo "AUDIO_CONSOLE=not_reached" > shots/audio_probe.txt
          echo "AUDIO_FOCUS_TAB=no" >> shots/audio_probe.txt
          cat shots/audio_probe.txt
          exit 1
        fi
        sleep 2
        adb exec-out screencap -p > shots/50_focus_tab.png
        for i in 1 2 3; do
          adb shell uiautomator dump /sdcard/uid.xml >> shots/probe-commands.log 2>&1
          adb pull /sdcard/uid.xml /tmp/uid.xml >> shots/probe-commands.log 2>&1 || true
          if grep -q '&#128202;' /tmp/uid.xml; then break; fi
          HXY=$(python3 - <<'PYHD'
        import re
        xml = open('/tmp/uid.xml', encoding='utf-8').read()
        best = None
        for m in re.finditer(r'<node\b[^>]*>', xml):
            tag = m.group(0)
            tm = re.search(r'text="([^"]*)"', tag)
            bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
            if not bm:
                continue
            val = tm.group(1) if tm else ''
            if val in ('▸', '◂', '▾', '▴'):
                x0, y0, x1, y1 = (int(bm.group(k)) for k in range(1, 5))
                cx, cy = (x0 + x1) // 2, (y0 + y1) // 2
                edge = min(cx, 1080 - cx)
                if best is None or edge < best[0]:
                    best = (edge, cx, cy)
        if best:
            print(best[1], best[2])
        PYHD
          )
          if [ -n "$HXY" ]; then adb shell input tap $HXY; fi
          sleep 3
        done
        adb exec-out screencap -p > shots/51_audio_dock.png
        HPXY=$(python3 - <<'PYHP'
        import re
        xml = open('/tmp/uid.xml', encoding='utf-8').read()
        best = None
        for m in re.finditer(r'<node\b[^>]*>', xml):
            tag = m.group(0)
            tm = re.search(r'text="([^"]*)"', tag)
            bm = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', tag)
            if not bm:
                continue
            val = tm.group(1) if tm else ''
            if '&#127911;' in val:
                x0, y0, x1, y1 = (int(bm.group(k)) for k in range(1, 5))
                if x1 > x0 and y1 > y0:
                    best = ((x0 + x1) // 2, (y0 + y1) // 2)
        if best:
            print(best[0], best[1])
        PYHP
        )
        if [ -n "$HPXY" ]; then adb shell input tap $HPXY; fi
        sleep 3
        adb exec-out screencap -p > shots/51b_audio_console.png
        CONSOLE_OK=no
        for i in 1 2 3 4 5; do
          if try_tap "إضافة صوت من الجهاز"; then CONSOLE_OK=yes; break; fi
          sleep 2
        done
        if [ "$CONSOLE_OK" != yes ]; then
          echo "AUDIO_CONSOLE=not_reached" > shots/audio_probe.txt
          adb shell uiautomator dump /sdcard/uia.xml >> shots/probe-commands.log 2>&1
          adb pull /sdcard/uia.xml shots/ui_audio_blocker.xml >> shots/probe-commands.log 2>&1 || true
          cat shots/audio_probe.txt
          exit 1
        fi
        sleep 4
        try_tap "Show roots" || true
        sleep 2
        try_tap "Downloads" || true
        sleep 3
        adb exec-out screencap -p > shots/52_picker.png
        adb shell uiautomator dump /sdcard/uip.xml >> shots/probe-commands.log 2>&1
        adb pull /sdcard/uip.xml shots/ui_audio_picker.xml >> shots/probe-commands.log 2>&1
        DOCXY=$(python3 - <<'PYDOC'
        import xml.etree.ElementTree as ET, re
        root = ET.parse('shots/ui_audio_picker.xml').getroot()
        candidates = []
        for n in root.iter('node'):
            text = n.get('text', '')
            rid = n.get('resource-id', '')
            if text != 'waqt_probe_alpha.wav':
                continue
            b = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.get('bounds', ''))
            if not b:
                continue
            x0, y0, x1, y1 = map(int, b.groups())
            if x1 > x0 and y1 > y0:
                score = 10 if rid.endswith('/title') else 0
                candidates.append((score, (x0+x1)//2, (y0+y1)//2))
        if candidates:
            _, x, y = max(candidates)
            print(x, y)
        PYDOC
        )
        if [ -z "$DOCXY" ]; then
          echo "AUDIO_PICKER_TITLE=not_found" > shots/audio_probe.txt
          exit 1
        fi
        adb shell input tap $DOCXY
        sleep 6
        adb exec-out screencap -p > shots/53_after_pick.png
        sleep 6
        adb logcat -d > shots/audio_probe_logcat.txt || true
        adb shell dumpsys media.player > shots/audio_dumpsys.txt 2>>shots/probe-commands.log || true
        PICK_LINE=$(grep 'WAQT_AUDIO_TRACE.*PICKED' shots/audio_probe_logcat.txt | tail -1 || true)
        COUNT=$(echo "$PICK_LINE" | grep -o 'count=[0-9]*' | cut -d= -f2 || true)
        echo "AUDIO_PICKED_COUNT=${COUNT:-0}" > shots/audio_probe.txt
        if echo "$PICK_LINE" | grep -q 'name=waqt_probe_alpha.wav'; then echo "AUDIO_PICKED_ALPHA=yes" >> shots/audio_probe.txt; else echo "AUDIO_PICKED_ALPHA=no" >> shots/audio_probe.txt; fi
        if grep 'WAQT_AUDIO_TRACE.*PLAY_CUSTOM' shots/audio_probe_logcat.txt | grep -q 'name=waqt_probe_alpha.wav'; then echo "AUDIO_PLAY_CUSTOM=waqt_probe_alpha.wav" >> shots/audio_probe.txt; else echo "AUDIO_PLAY_CUSTOM=none" >> shots/audio_probe.txt; fi
        if grep 'WAQT_AUDIO_TRACE.*PLAY_CUSTOM' shots/audio_probe_logcat.txt | grep -q 'waqt_probe_beta'; then echo "AUDIO_OTHER_FILE_PLAYED=yes" >> shots/audio_probe.txt; else echo "AUDIO_OTHER_FILE_PLAYED=no" >> shots/audio_probe.txt; fi
        DISTINCT=$(grep 'WAQT_AUDIO_TRACE.*PLAY_CUSTOM' shots/audio_probe_logcat.txt | grep -o 'name=[^ ]*' | sort -u | wc -l)
        echo "AUDIO_PLAY_DISTINCT=$DISTINCT" >> shots/audio_probe.txt
        if grep -q '^AUDIO_PICKED_COUNT=1$' shots/audio_probe.txt && grep -q '^AUDIO_PICKED_ALPHA=yes$' shots/audio_probe.txt && grep -q '^AUDIO_PLAY_CUSTOM=waqt_probe_alpha.wav$' shots/audio_probe.txt && [ "$DISTINCT" = "1" ] && grep -q '^AUDIO_OTHER_FILE_PLAYED=no$' shots/audio_probe.txt; then echo "AUDIO_UI_LOG_ISOLATION=pass" >> shots/audio_probe.txt; else echo "AUDIO_UI_LOG_ISOLATION=fail" >> shots/audio_probe.txt; fi
        cat shots/audio_probe.txt
        grep -q '^AUDIO_UI_LOG_ISOLATION=pass$' shots/audio_probe.txt

        adb shell dumpsys media.audio_flinger > shots/audio_flinger.txt 2>>shots/probe-commands.log
        adb shell dumpsys media.metrics > shots/audio_metrics.txt 2>>shots/probe-commands.log
        adb exec-out cat /data/user/0/com.example.glassproductivity/shared_prefs/waqt_prefs.xml > shots/audio-saved-preferences.xml
        python3 - <<'PYPREF'
        import json,xml.etree.ElementTree as E
        r=E.parse('shots/audio-saved-preferences.xml').getroot()
        p={n.get('name'):n.text for n in r}
        a=json.loads(p['focus_custom_audio_tracks'])
        assert len(a)==1,a
        assert a[0]['name']=='waqt_probe_alpha.wav',a
        assert p['custom_audio_name']=='waqt_probe_alpha.wav',p
        assert 'waqt_probe_beta' not in p['focus_custom_audio_tracks'],a
        print('SIGNED_AUDIO_SAVED_SELECTION=ONLY_ALPHA')
        open('shots/saved-selection-verdict.txt','w').write('SIGNED_AUDIO_SAVED_SELECTION=ONLY_ALPHA\n')
        PYPREF
    - name: Preserve exact signed audio evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: signed-local-audio-evidence
        path: shots/
    - name: Publish disposable signed audio evidence
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/audio-evidence
        cp shots/* /tmp/audio-evidence/ 2>/dev/null || true
        cp /tmp/emulator.log /tmp/audio-evidence/emulator.log 2>/dev/null || true
        cd /tmp/audio-evidence
        git init
        git config user.name 'Waqt CI'
        git config user.email 'waqt-ci@users.noreply.github.com'
        git add .
        git commit -m 'Disposable exact signed local audio probe evidence' || true
        git branch -M "signed-audio-evidence-r${{ github.run_id }}"
        git push "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" HEAD --force
